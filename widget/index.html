<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>근태</title>
<!--
  근태 데스크톱 위젯 화면 (2026-07-30)
  · 주소 = https://think-fact0ry.github.io/attend/widget/
  · 창 자체가 알약이다. 모서리·그림자는 **윈도우가 그린다**(DWM) — CSS로 라운드를 또 그리면
    두 표면이 같은 곡선을 각자 정의해 경계 픽셀이 어긋난다(21차 딤 모서리 6라운드의 근본 사실).
  · 이 파일은 Pages에서 로드된다 = 고치고 push하면 전 PC가 다음 실행부터 반영(exe 재배포 불요).

  ⭐도장 앞에는 반드시 PIN (유성 07-30):
    "위젯에서 도장이 안 찍히게 해야지. 키패드를 눌러야 어떤 제공인력인지 확인이 되지."
    작은 알약을 누르면 **키패드**가 먼저 뜬다. PIN이 맞아야 출근·퇴근 화면으로 바뀐다.
    알약에 보이는 시간은 호스트가 들고 있는 세션으로 **읽기만** 한다 — 그걸로는 도장을 못 찍는다.

  ⚠️창 높이는 **재지 않고 상수로 정한다**. 재서 보내던 때 열 때마다 커졌다 작아졌다 했다(유성 2회 신고).
    웹폰트·레이아웃이 잡히는 시점이 매번 달라서 측정값이 흔들린다 → 측정을 아예 없앤다.
-->
<!--
  ⚠️웹폰트는 **첫 페인트를 막지 않게** 불러온다(07-31).
    구판은 <style> 첫 줄의 `@import`였는데, cross-origin CSS의 @import는 렌더 차단이라
    **부팅 직후 네트워크가 아직 없으면 알약이 그동안 빈칸**이었다(게다가 sw의 오프라인 폴백이
    CSS 요청에 index.html을 돌려줘 더 늦어진다). media="print"로 받아 로드된 뒤 all로 바꾸면
    폰트가 늦게 와도 글자는 먼저 뜬다. 폭 재측정은 아래 `document.fonts.ready` 훅이 이미 한다.
-->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g900:#191f28;
  --green100:#e9f8ee; --green600:#3a8a5f; --green700:#166841;
  --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#c07f00; --red:#f04452;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff}
body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  user-select:none;word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ── 작은 알약 ── */
#pill{display:flex;align-items:center;gap:9px;padding:0 15px;position:relative;
  height:34px;flex:0 0 34px;cursor:pointer;transition:opacity .2s}
body.open #pill{display:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green100);transition:width .4s ease}
body.warn #fill{background:var(--warn-weak-bg)}
#dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--g400);flex:0 0 auto;transition:background .2s}
body.on #dot{background:var(--green600)}
body.warn #dot{background:var(--warn)}
#t{position:relative;font-size:14px;font-weight:700;color:var(--g600);letter-spacing:-.4px;
  white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
body.on #t{color:var(--green700)}
body.warn #t{color:var(--warn-weak-fg)}
#nc{position:relative;width:5px;height:5px;border-radius:50%;background:var(--g300);flex:0 0 auto;display:none}
body.nc #nc{display:block}
body.dim #pill{opacity:.45}
body.moving #pill{cursor:move;opacity:.6}

/* ── 중간 위젯(공통) ── */
#panel{display:none;position:relative;padding:14px 16px 16px;height:100%;box-sizing:border-box}
body.open #panel{display:block}
/* − : 작게. 히트 영역을 넉넉히(유성 "잘 안 눌려") */
#mini{position:absolute;top:4px;right:4px;z-index:9;transition:transform .16s cubic-bezier(.2,.7,.3,1);width:34px;height:34px;border:0;background:transparent;
  color:var(--g500);font:inherit;font-size:22px;font-weight:600;line-height:1;cursor:pointer;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0}
#mini:hover{background:var(--g100);color:var(--g700)}
#mini:active{background:var(--g200);transform:scale(.86)}
.step{display:none;animation:rise .16s ease both}
.step.on{display:block}
.step > *{animation:rise .18s ease both}
.step > *:nth-child(2){animation-delay:.04s}
.step > *:nth-child(3){animation-delay:.08s}
.step > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ── 1단계: 키패드 (앱 #s-gate / 태블릿 g-pad 문법 — §4.2. 랜덤 배열은 뺌) ── */
#sPin{display:none;flex-direction:column;height:100%;box-sizing:border-box}
#sPin.on{display:flex}
/* ⚠️머리 영역은 **높이 고정**. 제목이 사라질 때 전체가 위로 딸려 올라가면 안 된다(유성 07-30)
     — 제목은 그 자리에서 사라지고, 점만 올라간다. 키패드는 미동도 없다. */
.g-head{position:relative;flex:0 0 72px;margin-top:6px}
.g-titles{position:absolute;left:0;right:0;top:2px;text-align:center;
  opacity:1;transform:translateY(0);transition:opacity .28s ease,transform .34s cubic-bezier(.4,0,.2,1)}
.g-titles.hide{opacity:0;transform:translateY(-10px);pointer-events:none}
.g-titles h1{font-size:14px;font-weight:600;margin:0;color:var(--g900);transition:color .2s}
.g-titles h1.err{color:var(--red)}
.g-titles h1.okmsg{color:var(--green700);font-weight:700}
.g-titles h1.shake{animation:gshake .35s}
/* §5.2 출렁이는 점 — 앱 `.ldd` 실코드 복제(정적 '…' 금지). 서버 왕복 동안 침묵하지 않는다. */
.ldd{display:inline-flex;gap:3px;margin-left:7px;vertical-align:middle}
.ldd i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:ldb 1s ease-in-out infinite}
.ldd i:nth-child(2){animation-delay:.16s}
.ldd i:nth-child(3){animation-delay:.32s}
@keyframes ldb{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
@keyframes gshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pindots{position:absolute;left:0;right:0;top:38px;display:flex;gap:15px;justify-content:center;
  transition:transform .34s cubic-bezier(.4,0,.2,1)}
.pindots.up{transform:translateY(-22px)}
.pindots i{width:8px;height:8px;border-radius:50%;background:var(--g300);box-shadow:0 0 0 3px rgba(176,184,193,.16);
  transition:background .22s,box-shadow .3s cubic-bezier(.2,.7,.3,1)}
.pindots i.f{background:var(--green600);box-shadow:0 0 0 3px rgba(58,138,95,.18)}
.pindots.ok i{background:var(--green600);box-shadow:0 0 0 5px rgba(58,138,95,.22)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;width:100%}
.pinpad button{position:relative;height:42px;border-radius:11px;background:transparent;border:0;font:inherit;
  font-size:19px;font-weight:500;color:var(--g900);display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;transition:transform .18s cubic-bezier(.2,.7,.3,1);touch-action:manipulation}
.pinpad button:active{transform:scale(.9)}
/* 지움 — 숫자보다 작고 연하게(유성) */
.pinpad button.fn{color:var(--g400);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .22s ease}
.pinpad button.fn.show{opacity:1;pointer-events:auto}
.pinpad button.empty{pointer-events:none}
.pinpad .ripple{position:absolute;left:50%;top:50%;width:175%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, rgba(58,138,95,.42) 0%, rgba(58,138,95,.16) 42%, rgba(58,138,95,0) 70%);
  transform:translate(-50%,-50%) scale(.2);pointer-events:none;z-index:0;animation:grip .58s ease-out forwards}
@keyframes grip{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}100%{transform:translate(-50%,-50%) scale(1.75);opacity:0}}
.g-forgot{width:100%;margin-top:2px;background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--g500);opacity:.55;cursor:pointer;padding:7px;border-radius:10px;transition:background .4s,opacity .4s,transform .3s}
.g-forgot.as-btn{background:rgba(58,138,95,.06);opacity:1;color:var(--green700)}
.g-forgot:active{transform:scale(.94)}
.perr{font-size:12px;color:var(--red);line-height:1.5;margin-top:8px}
/* ── 1.5단계: 확인 완료 ── */
#sOk{display:none;height:100%;box-sizing:border-box}
#sOk.on{display:flex;align-items:center;justify-content:center}
.okwrap{text-align:center}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--green600);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;animation:pop .42s cubic-bezier(.2,1.3,.4,1) both}
.okmark svg{width:32px;height:32px}
.okname{font-size:16px;font-weight:700;color:var(--g900);letter-spacing:-.4px;
  animation:rise .3s ease .12s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ── 2단계: 출근·퇴근 ── */
#sAct .ph{font-size:12px;font-weight:700;color:var(--g500);letter-spacing:-.2px}
#sAct .pv{font-size:21px;font-weight:800;color:var(--g900);letter-spacing:-.6px;margin:3px 0 13px;font-variant-numeric:tabular-nums}
.pb{display:block;width:100%;border:0;background:var(--green600);color:#fff;font:inherit;font-size:15px;
  font-weight:600;padding:12px;border-radius:11px;cursor:pointer;letter-spacing:-.3px}
.pb:active{background:var(--green700)}
.pb:disabled{background:#b7e0c8;cursor:default}
/* 유성 "'근태 앱 열기' 버튼이 안 보여" → 연한 면을 깔아 버튼으로 읽히게 */
.pb.ghost{background:var(--g50);color:var(--g700);border:1px solid var(--g200);margin-top:8px}
.pb.ghost:active{background:var(--g100)}
</style>
</head>
<body>
  <div id="pill">
    <div id="fill"></div><span id="dot"></span><span id="t">근태</span><span id="nc" title="연결 안 됨"></span>
  </div>

  <div id="panel">
    <button id="mini" title="작게">−</button>

    <!-- 1단계 — 누구인지부터 확인한다 -->
    <div class="step on" id="sPin">
      <div class="g-head">
        <div class="g-titles" id="gTit"><h1 id="gH1">비밀번호를 눌러주세요</h1></div>
        <div class="pindots" id="dots"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="pinpad" id="kp"></div>
      <button class="g-forgot" id="gForgot">비밀번호를 몰라요</button>
    </div>

    <!-- 1.5단계 — 확인됐다는 걸 분명히 보여준다(유성: 가운데 큰 아이콘 + ooo님 안녕하세요) -->
    <div class="step" id="sOk">
      <div class="okwrap">
        <div class="okmark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
        </div>
        <div class="okname" id="okName">안녕하세요</div>
      </div>
    </div>

    <!-- 2단계 — 확인된 뒤에만 -->
    <div class="step" id="sAct">
      <div class="ph" id="pLabel">근무한 시간</div>
      <div class="pv" id="pVal">근무 전</div>
      <button class="pb" id="pDo">출근</button>
      <button class="pb ghost" id="pOpen">근태 앱 열기</button>
      <div class="perr" id="pErr"></div>
    </div>
  </div>

<script>
/* ══════════ 설정 ══════════ */
var GAS = 'https://script.google.com/macros/s/AKfycbwNB7J3m_Q0GSYubJf11jpa4DJ8SyUuwU-Ma0r3db446Nl56_yGRkFq_dsaXq5gk70FWQ/exec';
/* ⭐물어보는 주기는 **근무 전이 더 짧다**(07-31 유성 신고 "앱은 로그인 상태인데 알약은 근무전").
     근무 중엔 알약이 `open`+서버시각으로 **스스로 센다** → 서버에 자주 물을 이유가 없다(밖에서 찍은 퇴근만 늦게 안다).
     근무 전엔 스스로 알 방법이 **하나도 없다** → 앱·폰에서 출근을 찍어도 다음에 물을 때까지 '근무 전'이다.
     구판은 이게 뒤집혀 있어(근무 전 15분) 앱 창을 열어 둔 채 출근하면 최대 15분간 '근무 전'이었다. */
var HB_WORKING = 3 * 60 * 1000, HB_IDLE = 60 * 1000;
var AFTER_OUT_MS = 30 * 60 * 1000, OFFLINE_MARK_MS = 5 * 60 * 1000;
var SHOW_LATE = false;   // 지각 색은 공용 표면이라 기본 꺼짐(§판정 원칙 3 "판정하지 않는다")

/* 창 높이 = **상수**. 재지 않는다(측정하면 열 때마다 흔들린다 — 유성 2회 신고) */
//   H_ERR=두 줄까지 넉넉히(12px·line-height 1.5·margin 8 → 한 줄 26·두 줄 44). 실패 문구는 길 수 있다.
var H_PILL = 34, H_PIN = 306, H_OK = 168, H_ACT = 178, H_ERR = 44;

/* ══════════ 상태 ══════════ */
var auth = null;        // 알약에 시간을 띄우기 위한 **읽기 전용** 세션(호스트가 준다)
var snap = null, snapAt = 0, lastOkAt = 0, bootAt = performance.now();
var bootRep = null;   // 호스트가 넘긴 시작 시각 보고 — 서버가 받아줄 때까지 들고 있는다
var inFlight = false, inFlightAt = 0, dayRolled = false, fails = 0;
var lastPerf = 0, lastWall = 0, hbTimer = null, tickTimer = null, lastSent = '';
var open = false, step = 'pin', pin = '', punching = false, punchAt = 0, verifying = false, verifyAt = 0;
/* ⭐도장용 세션의 수명 — **확정 결정을 따른다**(scripts/19 CLAUDE.md, 2026-07-24 유성):
     "세션=곧 찍는 사람이라 도장마다 PIN 재입력 없음"(구 _pinIdentity_=도장마다 PIN은 폐기).
     공용 회사 PC 세션 종료 = ①퇴근 도장 즉시 ②유휴 1시간 ③잠그기.
   ⚠️07-30 1차에 "접으면 세션을 버린다"로 만들었는데, 그러면 도장마다 PIN이 되어 폐기된 옛 모델의 부활이다.
     접는 것은 종료가 아니다. */
var act = null, actAt = 0;
/* 🔴알약은 **스스로 갱신되지 않는다**(2026-08-15 실측으로 드러남).
     앱은 열 때마다 network-first로 새 문서를 받지만, 알약은 exe가 뜰 때 딱 한 번 Navigate하고 끝이다
     → `edge.log`가 증거: 마지막 `알약: ready`가 **08-13 21:59**(exe 재설치 시각), 그 뒤 08-15까지 0회.
     그래서 08-15에 배포한 알약 수정이 **그 PC에서 한 번도 실행되지 않은 채** "아직도 안 고쳐졌다"가 됐다.
     ⇒ 날짜가 바뀌면 알약이 스스로 다시 읽는다. 자정=세션 종료 규칙과 이미 같은 결이라 잃는 것도 없다
       (act가 없을 때만 = 아무도 쓰는 중이 아닐 때만). 호스트는 `ready`에 auth·앱상태를 다시 밀어준다. */
var PILL_VER = 'v90';                       // 로그에 찍는다 — "지금 도는 알약이 몇 판인가"를 추측하지 않으려고
function ymdLocal(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
var BOOT_DAY = ymdLocal();
var ACT_IDLE_MS = 60 * 60 * 1000;
/* 🔴퇴근을 누른 뒤 **서버 확답을 기다리는 동안**(GAS 왕복 1.2~2초)에도 세션은 아직 살아 있다.
     그 사이 알약을 다시 누르면 `actAlive()`가 참이라 **PIN 없이 도장 화면**이 열렸다(유성 08-03 신고 —
     완료 연출 900ms가 끝나고 접힌 직후부터 응답이 올 때까지가 그 창이다).
     ⇒ 퇴근 요청이 나간 순간부터 **이미 닫힌 세션으로 취급**한다. 세션을 실제로 비우지는 않는다 —
     도장이 실패하면 그 자리에 이유를 보여줘야 하고(`pErr`는 도장 화면 안에 있다), 그건 24차에
     "세션 종료는 서버가 답한 뒤"로 정한 이유다. 그 결정을 지키면서 화면만 먼저 잠근다. */
var outPending = false;
function actAlive(){
  if (!act) return false;
  if (Date.now() - actAt > ACT_IDLE_MS) { endActSession(); return false; }
  return true;
}
/* 세션 시작 — 위젯과 **앱의 잠금을 같이 푼다**.
   유성 07-30: "위젯에서 키패드를 통과했는데 근태 앱을 열면 왜 또 입력해."
   앱은 같은 출처·같은 프로필이라 localStorage를 그대로 쓴다 → 여기서 열어 주면 앱이 안 묻는다. */
function startActSession(r){
  act = { token: r.token, emp: r.emp, name: r.name || '' };
  actAt = Date.now();
  auth = { token: r.token, emp: r.emp };
  try {
    localStorage.setItem('att_token', r.token);
    localStorage.setItem('att_emp', r.emp);
    localStorage.removeItem('att_locked');
    /* 🔴자정 잠금까지 같이 풀어야 한다(2026-08-15 유성 "위젯에서 pin 넣었는데 앱이 또 물어봐").

function verifying_on(){

  d.classList.remove('up');    // ⚠️필수 — 'up'은 제목이 사라진 자리로 점을 올린다. 제목을 되살리면서 안 내리면 둘이 겹친다
  var h = $('gH1');

// 정리(성공·실패)는 기존 경로가 이미 한다 — 성공=제목 textContent 복구+drawDots / 실패=pinFail의 textContent+drawDots.
//   drawDots가 'ok'·'up'을 모두 되돌리므로 해제 함수를 따로 두지 않는다(안 쓰이는 함수를 남기지 않는다).
function verify(){
  verifying = true; verifyAt = performance.now();

  // lite=위젯은 token·emp·name만 쓴다. 서버가 근태이력 전체+스윕을 건너뛴다(왕복 자체가 가벼워진다).

  ask({ action:'login', pin: pin, inst: INST, lite: true })
    .then(function(r){
      verifying = false;
      if (!r || !r.ok) { pinFail((r && r.error) || '비밀번호가 맞지 않아요'); return; }
      startActSession(r);
      // 확인됐다는 걸 **독립 화면**으로 보여준다(가운데 큰 체크 + ooo님 안녕하세요).

      $('gH1').classList.remove('err'); $('gForgot').classList.remove('as-btn'); drawDots();
      $('okName').textContent = (act.name ? act.name + '님 안녕하세요' : '안녕하세요');
      setStep('ok');

      setTimeout(function(){ if (open) setStep('act'); }, 500);

    .catch(function(){ verifying = false; pinFail('연결이 안 돼요'); });

/* ⏱️**모든 서버 요청에 시한을 건다**(2026-07-31 — 유성 "퇴근했는데 알약이 계속 초록, 시간이 계속 간다").
     🔴그 사고의 정체: `fetch`에 타임아웃이 없어 **GAS가 응답을 안 주면 그 약속이 영원히 안 끝난다**
       → `inFlight`가 true로 굳고 → `.then`/`.catch` 어느 쪽도 안 불려 **다음 조회 예약(`schedule`)까지 죽는다**
       → 그 뒤 모든 조회가 `if(inFlight) return`으로 즉시 돌아가 **알약이 영구히 옛 상태로 멈춘다**.

     구판은 트레이 풍선 하나뿐이었는데, 패널은 이미 접혔고 알약은 조용히 '근무 전'으로 되돌아갔다
     → 출근이 안 됐는데 찍힌 줄 알기 쉬운 구조였다(제일 나쁜 실패 모양).
     앱도 같은 규칙이다 — 완료를 이미 봤으면 토스트로 부족하다(12차 낙관 쓰기 3규칙).
   ⚠️`snapAt`은 **되돌리지 않는다**. `prev.nowHms`는 그 스냅샷을 받은 시각이라, 여기서 지금으로 다시 찍으면
     알약 시계가 그동안 흐른 만큼 **뒤로 간다**(다음 조회 때까지). 옛 기준점 그대로가 맞다. */
/* 도장 완료 인터랙션 (유성 지시 — 07-30에 받았으나 인계에 안 남아 07-31에 처리).
     구판은 도장을 누르면 `setOpen(false)`로 **말없이 접혔다** — 찍혔는지 아닌지 화면이 말해주지 않았다.
     ⚠️새 UI를 만들지 않는다 — PIN 통과 때 쓰는 확인 화면(`#sOk`, 큰 체크)을 **그대로 재사용**한다(§2.2 정보밀도·중복 자산 금지).
     ⚠️**연출 길이가 곧 대기 시간**이다(위젯은 "빨리 접힌다"가 원래 장점) → 900ms만.
       도장은 낙관적이라 서버를 안 기다린다 = 이 900ms가 전부다.
     ⚠️실패가 오면 `punchFailed`가 화면을 도장 화면으로 되돌리므로, 그때는 **접지 않는다**(step 가드). */
function showDone(kind){
  $('okName').textContent = (kind === 'in' ? '출근했어요' : '퇴근했어요');
  setStep('ok');
  render();
  setTimeout(function(){ if (step === 'ok') setOpen(false); }, 900);
}
function punchFailed(prev, msg){
  snap = prev;                    // snapAt은 그대로 — 기준점을 옮기면 시계가 역행한다
  setOpen(true);                  // ⚠️먼저 펼친다 — setOpen(true)가 pErr를 비우므로 문구는 그 뒤에 넣는다
  $('pErr').textContent = msg;
  render();                       // 늘어난 높이를 호스트에 다시 알린다(panelH가 pErr를 센다)
  toHost({ type:'alert', msg: msg });
}

/* ══════════ 그리기 ══════════ */
function sendState(){
  var v = view();
  var offline = !!auth && (performance.now() - (lastOkAt || bootAt) > OFFLINE_MARK_MS);
  var w = open ? 236 : (15 + 8 + 9 + $('t').offsetWidth + 15 + (offline ? 14 : 0));
  var h = open ? panelH() : H_PILL;
  var sig = Math.ceil(w) + 'x' + h + '|' + (v.on?1:0) + '|' + (v.warn?1:0) + '|' + (v.dim?1:0);
  if (sig === lastSent) return;
  lastSent = sig;
  toHost({ type:'state', w:Math.ceil(w), h:h, on:v.on, warn:v.warn, dim:v.dim });
}
var lastText = null, lastGauge = null;
function render(){
  var v = view();
  var b = document.body;
  b.classList.toggle('on', v.on); b.classList.toggle('warn', v.warn); b.classList.toggle('dim', v.dim);
  var offline = !!auth && (performance.now() - (lastOkAt || bootAt) > OFFLINE_MARK_MS);
  b.classList.toggle('nc', offline);
  // 1초 루프가 매번 같은 값을 다시 써서 레이아웃을 무의미하게 무르게 하지 않는다(값이 바뀔 때만).
  if (v.text !== lastText) { lastText = v.text; $('t').textContent = v.text; }
  if (v.gauge !== lastGauge) { lastGauge = v.gauge; $('fill').style.width = v.gauge + '%'; }

  if (open && step === 'act') {
    var working = !!(snap && snap.open);
    // 유성: "오늘 일한 시간 X / ooo님이 근무한 시간 O"
    $('pLabel').textContent = (act && act.name ? act.name + '님이 ' : '') + '근무한 시간';
    $('pVal').textContent = v.text;
    // 🔴26차-6(현아쌤 08-06 "퇴근을 늦게 눌렀는데 컴퓨터로 했더니 5시간이 기록"): 알약 도장은 **시각 입력이 없다**
    //   (`punch`를 time 없이 보낸다 = 누른 그 시각). 종업이 지난 뒤엔 '지금'이 틀린 값일 수 있으므로
    //   ①버튼에 **그 시각을 박아** 무엇이 기록되는지 누르기 전에 보이게 하고 ②다른 시각이면 앱으로 가라고 말한다.
    //   알약에 시각 입력을 새로 만들지 않는 이유=같은 판정(§4.1-9 관용·세그·거절 문구)을 두 번 구현하면 두 진실이 된다.
    var lateOut = working && !!(snap && snap.end) && serverSecNow() >= hms2sec(snap.end);
    $('pDo').textContent = working ? (lateOut ? (ampm(sec2hms(serverSecNow())) + '에 퇴근') : '퇴근') : '출근';
    $('pDo').style.display = (snap && snap.work && !snap.external) ? '' : 'none';
    /* 26차-11(유성 08-13 "앱이 열린 상태에서 중간위젯을 켜면 '근태 앱 닫기'로 표기되어야 맞음"):
       호스트는 **이미 토글**이었다(`ToggleApp` — 열려 있으면 FadeClose). 동작은 옳은데 글자만 늘 '열기'라
       누르기 전에 무슨 일이 날지 못 알려주는 버튼이었다(26차-6 "버튼 문구에 그 시각을 박는다"와 같은 결).
       ⚠️열려 있으면 `lateOut`(다른 시각에 나왔어요)보다 '닫기'가 이긴다 — 그 버튼은 *앱으로 보내는* 길인데
       이미 앱 안에 있으니 보낼 곳이 없다. */
    $('pOpen').textContent = appOpen ? '근태 앱 닫기' : (lateOut ? '다른 시각에 나왔어요' : '근태 앱 열기');
  }
  sendState();
}
function loop(){
  // 날짜가 넘어갔고 아무도 쓰는 중이 아니면 **새 코드를 읽는다**(위 PILL_VER 주석의 실사고).
  //   조건을 다 건다: 세션 없음·접혀 있음·비행 중 아님 — 사람이 도장을 찍는 중에 페이지가 사라지면 안 된다.
  if (!act && !open && !punching && !verifying && !inFlight && ymdLocal() !== BOOT_DAY) {
    try { location.reload(); } catch (e) { }
    return;                                   // 다음 틱 예약도 하지 않는다(새 문서가 스스로 시작한다)
  }
  // 앱(같은 출처·같은 프로필)이 잠기면 = 퇴근했거나 유휴로 잠긴 것 → 위젯 세션도 함께 끝난다.
  //   앱에서 퇴근을 찍은 경우 위젯은 그 사실을 모르고 도장 화면을 열어 준다(유성 신고).
  if (act) {
    var lk = null; try { lk = localStorage.getItem('att_locked'); } catch (e) { }
    //   ⚠️`act`만 지우고 끝내면 **화면은 옛 상태 그대로**다(구판) — 앱이 잠겼다는 건 대개 퇴근했다는 뜻이므로 지금 묻고,
    //     서버 반영이 늦을 수 있으니 잠시 뒤 한 번 더 묻는다.
    if (lk === '1') { act = null; actAt = 0; if (open) setOpen(false); fetchTick(); recheckSoon(4000); }
  }
  // 🛟마지막 안전망 — 위 시한이 어떤 이유로든 안 걸렸을 때(중단 미지원 브라우저·예상 못 한 경로)도
  //   조회가 영구히 멈추지 않게 한다. **알약이 멈춰 있는 것보다 한 번 더 묻는 게 낫다.**
  if (inFlight && performance.now() - inFlightAt > REQ_TIMEOUT_MS * 2) {
    inFlight = false; schedule(false);
  }
  // 도장·비밀번호 확인도 같은 병에 걸린다 — 잠금이 굳으면 **그 뒤 도장이 전부 막히고 키패드가 안 먹는다.**
  if (punching && performance.now() - punchAt > REQ_TIMEOUT_MS * 2) {
    punching = false;
    if (outPending) { outPending = false; endActSession(); }   // 시한이 못 걸린 경우에도 퇴근 뒤 세션이 열린 채 남지 않게
  }
  if (verifying && performance.now() - verifyAt > REQ_TIMEOUT_MS * 2) { verifying = false; pinFail('연결이 안 돼요'); }
  var p = performance.now(), w = Date.now();
  if (lastPerf && Math.abs((w-lastWall)-(p-lastPerf)) > 60000) { dayRolled = false; fetchTick(); }
  lastPerf = p; lastWall = w;
  if (snap && !dayRolled && serverSecNow() >= 24*3600) { dayRolled = true; fetchTick(); }
  render();
  tickTimer = setTimeout(loop, 1000);
}

document.fonts && document.fonts.ready.then(function(){ lastSent = ''; render(); });
render(); loop(); schedule();
toHost({ type:'ready', m: PILL_VER });   // 호스트가 `알약: ready (v88)`로 남긴다 — 도는 판을 로그에서 바로 확인
</script>
</body>
</html>
