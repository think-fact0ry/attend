<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>근태</title>
<!--
  근태 데스크톱 위젯 화면 (2026-07-30)
  · 주소 = https://think-fact0ry.github.io/attend/widget/
  · 창 자체가 알약이다. 모서리·그림자는 **윈도우가 그린다**(DWM) — CSS로 라운드를 또 그리면
    두 표면이 같은 곡선을 각자 정의해 경계 픽셀이 어긋난다(21차 딤 모서리 6라운드의 근본 사실).
  · 이 파일은 Pages에서 로드된다 = 고치고 push하면 전 PC가 다음 실행부터 반영(exe 재배포 불요).

  ⭐도장 앞에는 반드시 PIN (유성 07-30):
    "위젯에서 도장이 안 찍히게 해야지. 키패드를 눌러야 어떤 제공인력인지 확인이 되지."
    작은 알약을 누르면 **키패드**가 먼저 뜬다. PIN이 맞아야 출근·퇴근 화면으로 바뀐다.
    알약에 보이는 시간은 호스트가 들고 있는 세션으로 **읽기만** 한다 — 그걸로는 도장을 못 찍는다.

  ⚠️창 높이는 **재지 않고 상수로 정한다**. 재서 보내던 때 열 때마다 커졌다 작아졌다 했다(유성 2회 신고).
    웹폰트·레이아웃이 잡히는 시점이 매번 달라서 측정값이 흔들린다 → 측정을 아예 없앤다.
-->
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
:root{
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g900:#191f28;
  --green100:#e9f8ee; --green600:#3a8a5f; --green700:#166841;
  --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#c07f00; --red:#f04452;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff}
body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  user-select:none;word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ── 작은 알약 ── */
#pill{display:flex;align-items:center;gap:9px;padding:0 15px;position:relative;
  height:34px;flex:0 0 34px;cursor:pointer;transition:opacity .2s}
body.open #pill{display:none}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green100);transition:width .4s ease}
body.warn #fill{background:var(--warn-weak-bg)}
#dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--g400);flex:0 0 auto;transition:background .2s}
body.on #dot{background:var(--green600)}
body.warn #dot{background:var(--warn)}
#t{position:relative;font-size:14px;font-weight:700;color:var(--g600);letter-spacing:-.4px;
  white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
body.on #t{color:var(--green700)}
body.warn #t{color:var(--warn-weak-fg)}
#nc{position:relative;width:5px;height:5px;border-radius:50%;background:var(--g300);flex:0 0 auto;display:none}
body.nc #nc{display:block}
body.dim #pill{opacity:.45}
body.moving #pill{cursor:move;opacity:.6}

/* ── 중간 위젯(공통) ── */
#panel{display:none;position:relative;padding:14px 16px 16px;height:100%;box-sizing:border-box}
body.open #panel{display:block}
/* − : 작게. 히트 영역을 넉넉히(유성 "잘 안 눌려") */
#mini{position:absolute;top:4px;right:4px;width:34px;height:34px;border:0;background:transparent;
  color:var(--g500);font:inherit;font-size:22px;font-weight:600;line-height:1;cursor:pointer;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0}
#mini:hover{background:var(--g100);color:var(--g700)}
#mini:active{background:var(--g200)}
.step{display:none;animation:rise .16s ease both}
.step.on{display:block}
.step > *{animation:rise .18s ease both}
.step > *:nth-child(2){animation-delay:.04s}
.step > *:nth-child(3){animation-delay:.08s}
.step > *:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ── 1단계: 키패드 ── */
#sPin .khd{font-size:13.5px;font-weight:700;color:var(--g700);letter-spacing:-.3px;margin:2px 0 10px}
#dots{display:flex;gap:9px;justify-content:center;margin:0 0 12px}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--g200);display:block;transition:background .15s,transform .15s}
#dots i.f{background:var(--green600);transform:scale(1.12)}
#dots.bad i{background:var(--red)}
#sPin.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#kp button{border:0;background:var(--g50);color:var(--g900);font:inherit;font-size:19px;font-weight:600;
  padding:9px 0;border-radius:10px;cursor:pointer}
#kp button:active{background:var(--g200)}
#kp button.z{background:transparent;font-size:15px;color:var(--g500)}
.perr{font-size:12px;color:var(--red);line-height:1.5;margin-top:9px;min-height:0}

/* ── 2단계: 출근·퇴근 ── */
#sAct .ph{font-size:12px;font-weight:700;color:var(--g500);letter-spacing:-.2px}
#sAct .pv{font-size:21px;font-weight:800;color:var(--g900);letter-spacing:-.6px;margin:3px 0 13px;font-variant-numeric:tabular-nums}
.pb{display:block;width:100%;border:0;background:var(--green600);color:#fff;font:inherit;font-size:15px;
  font-weight:600;padding:12px;border-radius:11px;cursor:pointer;letter-spacing:-.3px}
.pb:active{background:var(--green700)}
.pb:disabled{background:#b7e0c8;cursor:default}
/* 유성 "'근태 앱 열기' 버튼이 안 보여" → 연한 면을 깔아 버튼으로 읽히게 */
.pb.ghost{background:var(--g50);color:var(--g700);border:1px solid var(--g200);margin-top:8px}
.pb.ghost:active{background:var(--g100)}
</style>
</head>
<body>
  <div id="pill">
    <div id="fill"></div><span id="dot"></span><span id="t">근태</span><span id="nc" title="연결 안 됨"></span>
  </div>

  <div id="panel">
    <button id="mini" title="작게">−</button>

    <!-- 1단계 — 누구인지부터 확인한다 -->
    <div class="step on" id="sPin">
      <div class="khd">비밀번호를 눌러주세요</div>
      <div id="dots"><i></i><i></i><i></i><i></i></div>
      <div id="kp"></div>
      <div class="perr" id="pinErr"></div>
    </div>

    <!-- 2단계 — 확인된 뒤에만 -->
    <div class="step" id="sAct">
      <div class="ph" id="pLabel">근무한 시간</div>
      <div class="pv" id="pVal">근무 전</div>
      <button class="pb" id="pDo">출근</button>
      <button class="pb ghost" id="pOpen">근태 앱 열기</button>
      <div class="perr" id="pErr"></div>
    </div>
  </div>

<script>
/* ══════════ 설정 ══════════ */
var GAS = 'https://script.google.com/macros/s/AKfycbwNB7J3m_Q0GSYubJf11jpa4DJ8SyUuwU-Ma0r3db446Nl56_yGRkFq_dsaXq5gk70FWQ/exec';
var HB_WORKING = 3 * 60 * 1000, HB_IDLE = 15 * 60 * 1000;
var AFTER_OUT_MS = 30 * 60 * 1000, OFFLINE_MARK_MS = 5 * 60 * 1000;
var SHOW_LATE = false;   // 지각 색은 공용 표면이라 기본 꺼짐(§판정 원칙 3 "판정하지 않는다")

/* 창 높이 = **상수**. 재지 않는다(측정하면 열 때마다 흔들린다 — 유성 2회 신고) */
var H_PILL = 34, H_PIN = 250, H_ACT = 178, H_ERR = 24;

/* ══════════ 상태 ══════════ */
var auth = null;        // 알약에 시간을 띄우기 위한 **읽기 전용** 세션(호스트가 준다)
var act = null;         // 키패드를 통과한 **도장용** 세션 {token, emp, name} — 접으면 버린다
var snap = null, snapAt = 0, lastOkAt = 0, bootAt = performance.now();
var inFlight = false, dayRolled = false, fails = 0;
var lastPerf = 0, lastWall = 0, hbTimer = null, tickTimer = null, lastSent = '';
var open = false, step = 'pin', pin = '', punching = false, verifying = false;

function $(id){ return document.getElementById(id); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '/attend/' }).catch(function(){});

/* ══════════ 호스트와의 대화 ══════════ */
function toHost(o){ if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(o)); }
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener('message', function(e){
    var m; try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch(_){ return; }
    if (!m || !m.type) return;
    if (m.type === 'auth')    { auth = m.token ? { token: m.token, emp: m.emp || 'hyeona' } : null; fetchTick(); }
    if (m.type === 'signout') { auth = null; act = null; snap = null; render(); }
    if (m.type === 'wake')    { fetchTick(); }
    if (m.type === 'dragend') { endHold(); }
  });
}

/* ══════════ 알약: 짧게=열기 / 3초 꾹=옮기기 ══════════ */
var HOLD_MS = 3000, holdT = null, moved = false;
function endHold(){ clearTimeout(holdT); holdT = null; document.body.classList.remove('moving'); }
$('pill').addEventListener('pointerdown', function(e){
  if (e.button !== 0) return;
  moved = false; clearTimeout(holdT);
  holdT = setTimeout(function(){ moved = true; document.body.classList.add('moving'); toHost({ type: 'drag' }); }, HOLD_MS);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  $('pill').addEventListener(ev, function(){ if (!moved) endHold(); });
});
$('pill').addEventListener('click', function(){
  if (moved) { moved = false; return; }
  setOpen(true);
});

/* ══════════ 펼치기·접기 ══════════ */
function panelH(){
  if (step === 'pin') return H_PIN + ($('pinErr').textContent ? H_ERR : 0);
  return H_ACT + ($('pErr').textContent ? H_ERR : 0);
}
function setStep(s){
  step = s;
  $('sPin').classList.toggle('on', s === 'pin');
  $('sAct').classList.toggle('on', s === 'act');
  sendState();
}
function setOpen(v){
  open = v;
  document.body.classList.toggle('open', open);
  if (open) {                      // 열 때는 언제나 키패드부터 — 누구인지 먼저 확인한다
    pin = ''; drawDots(); $('pinErr').textContent = ''; $('pErr').textContent = '';
    setStep('pin');
  } else {
    act = null;                    // 접으면 도장용 세션은 버린다(자리를 뜨면 남이 못 찍는다)
    pin = ''; drawDots();
  }
  render();
}
$('mini').addEventListener('click', function(e){ e.stopPropagation(); setOpen(false); });
$('pOpen').addEventListener('click', function(){ setOpen(false); toHost({ type: 'open' }); });

/* ══════════ 키패드 ══════════ */
(function buildKeypad(){
  var keys = ['1','2','3','4','5','6','7','8','9','←','0',''];
  var html = '';
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (k === '') { html += '<button class="z" disabled></button>'; continue; }
    html += '<button class="' + (k === '←' ? 'z' : '') + '" data-k="' + k + '">' + k + '</button>';
  }
  $('kp').innerHTML = html;
})();
function drawDots(){
  var d = $('dots').children;
  for (var i = 0; i < d.length; i++) d[i].className = i < pin.length ? 'f' : '';
  $('dots').classList.remove('bad');
}
$('kp').addEventListener('click', function(e){
  var b = e.target.closest('button[data-k]'); if (!b || verifying) return;
  var k = b.dataset.k;
  if (k === '←') { pin = pin.slice(0, -1); drawDots(); return; }
  if (pin.length >= 4) return;
  pin += k; drawDots();
  if (pin.length === 4) verify();
});
function verify(){
  verifying = true;
  $('pinErr').textContent = '';
  fetch(GAS, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'login', pin: pin, inst: 'widget' }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      verifying = false;
      if (!r || !r.ok) {
        pin = ''; $('dots').classList.add('bad');
        $('sPin').classList.add('shake');
        setTimeout(function(){ $('sPin').classList.remove('shake'); drawDots(); }, 320);
        $('pinErr').textContent = (r && r.error) || '비밀번호가 맞지 않아요';
        sendState();
        return;
      }
      act = { token: r.token, emp: r.emp, name: r.name || '' };
      // 호스트에도 넘겨 알약이 계속 시간을 읽게 한다(읽기 전용)
      toHost({ type: 'auth', token: r.token, emp: r.emp });
      auth = { token: r.token, emp: r.emp };
      pin = ''; drawDots();
      setStep('act');
      fetchTick();
    })
    .catch(function(){
      verifying = false; pin = ''; drawDots();
      $('pinErr').textContent = '연결이 안 돼요. 잠시 후 다시 눌러 주세요';
      sendState();
    });
}

/* ══════════ 서버 조회(읽기 전용) ══════════ */
function fetchTick(){
  if (!auth) { render(); schedule(); return; }
  if (inFlight) return;
  inFlight = true;
  fetch(GAS, { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'tick', token: auth.token, emp: auth.emp }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      inFlight = false;
      if (!r || !r.ok) {
        if (r && r.code === 'auth') { auth = null; act = null; snap = null; toHost({ type:'need-auth' }); }
        render(); schedule(false); return;
      }
      snap = r; snapAt = performance.now(); lastOkAt = performance.now(); dayRolled = false;
      render(); schedule(true);
    })
    .catch(function(){ inFlight = false; render(); schedule(false); });
}
function schedule(ok){
  clearTimeout(hbTimer);
  var wait;
  if (ok === false) { fails = Math.min(fails + 1, 3); wait = Math.min(20000 * Math.pow(2, fails - 1), 120000); }
  else { fails = 0; wait = (snap && snap.open) ? HB_WORKING : HB_IDLE; }
  hbTimer = setTimeout(function(){ fetchTick(); }, wait);
}

/* ══════════ 계산 ══════════ */
function hms2sec(s){ if (!s) return 0; var p = String(s).split(':'); return (+p[0]||0)*3600 + (+p[1]||0)*60 + (+p[2]||0); }
function sec2hms(s){ s = Math.max(0, Math.floor(s)); function p(n){ return (n<10?'0':'')+n; }
  return p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60); }
function fmt(min){ if (min < 60) return min + '분'; var h = Math.floor(min/60), m = min%60; return m ? (h+'시간 '+m+'분') : (h+'시간'); }
function serverSecNow(){ if (!snap) return 0; return hms2sec(snap.nowHms) + Math.floor((performance.now()-snapAt)/1000); }

function view(){
  if (!auth || !snap) return { text:'근태', on:false, warn:false, dim:false, gauge:0 };
  if (serverSecNow() >= 24*3600) return { text:'근무 전', on:false, warn:false, dim:false, gauge:0 };
  if (!snap.work) return { text:'휴무일', on:false, warn:false, dim:true, gauge:0 };
  var need = Math.max(1, (snap.planMin||0) - (snap.leaveMin||0));
  if (snap.external) return { text:'사무실 근무', on:true, warn:false, dim:false, gauge:100 };
  var worked = snap.workedMin || 0;
  if (snap.open) {
    worked += Math.floor(Math.max(0, serverSecNow() - hms2sec(snap.open))/60);
    return { text:fmt(worked), on:true, warn:SHOW_LATE && !!snap.late, dim:false, gauge:Math.min(100, worked/need*100) };
  }
  if (snap.lastOut) {
    var since = serverSecNow() - hms2sec(snap.lastOut);
    if (since >= 0 && since*1000 < AFTER_OUT_MS)
      return { text:fmt(worked), on:false, warn:false, dim:false, gauge:Math.min(100, worked/need*100) };
  }
  return { text:'근무 전', on:false, warn:false, dim:false, gauge:0 };
}

/* ══════════ 도장 — 키패드를 통과한 세션으로만 ══════════ */
$('pDo').addEventListener('click', function(){ punch(snap && snap.open ? 'out' : 'in'); });
function punch(kind){
  if (punching || !act || !snap) return;
  punching = true;
  $('pErr').textContent = '';

  var prev = JSON.parse(JSON.stringify(snap));
  var nowH = sec2hms(serverSecNow());
  if (kind === 'in') snap.open = nowH;
  else {
    snap.workedMin = (snap.workedMin||0) + Math.floor(Math.max(0, serverSecNow() - hms2sec(snap.open))/60);
    snap.open = null; snap.lastOut = nowH;
  }
  setOpen(false);            // ⚡즉시 접힌다. 출근·퇴근 **둘 다** 여기서 끝(구판은 퇴근만 늦었다)

  var dev = null; try { dev = JSON.parse(localStorage.getItem('att_dev') || 'null'); } catch(e){}
  var body = { action:'punch', kind:kind, token:act.token, emp:act.emp,
    cid: 'w' + Date.now() + Math.random().toString(36).slice(2) };
  if (dev && dev.id) { body.device = dev.id; body.deviceToken = dev.token; }

  fetch(GAS, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      punching = false;
      if (!r || !r.ok) { snap = prev; snapAt = performance.now(); render(); toHost({ type:'alert', msg:(r && r.error) || '기록이 안 됐어요' }); return; }
      fetchTick();
    })
    .catch(function(){ punching = false; fetchTick(); });  // 무응답=서버에 남았을 수 있다 → 되돌리지 말고 다시 묻는다
}

/* ══════════ 그리기 ══════════ */
function sendState(){
  var v = view();
  var offline = !!auth && (performance.now() - (lastOkAt || bootAt) > OFFLINE_MARK_MS);
  var w = open ? 236 : (15 + 8 + 9 + $('t').offsetWidth + 15 + (offline ? 14 : 0));
  var h = open ? panelH() : H_PILL;
  var sig = Math.ceil(w) + 'x' + h + '|' + (v.on?1:0) + '|' + (v.warn?1:0) + '|' + (v.dim?1:0);
  if (sig === lastSent) return;
  lastSent = sig;
  toHost({ type:'state', w:Math.ceil(w), h:h, on:v.on, warn:v.warn, dim:v.dim });
}
function render(){
  var v = view();
  var b = document.body;
  b.classList.toggle('on', v.on); b.classList.toggle('warn', v.warn); b.classList.toggle('dim', v.dim);
  var offline = !!auth && (performance.now() - (lastOkAt || bootAt) > OFFLINE_MARK_MS);
  b.classList.toggle('nc', offline);
  $('t').textContent = v.text;
  $('fill').style.width = v.gauge + '%';

  if (open && step === 'act') {
    var working = !!(snap && snap.open);
    // 유성: "오늘 일한 시간 X / ooo님이 근무한 시간 O"
    $('pLabel').textContent = (act && act.name ? act.name + '님이 ' : '') + '근무한 시간';
    $('pVal').textContent = v.text;
    $('pDo').textContent = working ? '퇴근' : '출근';
    $('pDo').style.display = (snap && snap.work && !snap.external) ? '' : 'none';
  }
  sendState();
}
function loop(){
  var p = performance.now(), w = Date.now();
  if (lastPerf && Math.abs((w-lastWall)-(p-lastPerf)) > 60000) { dayRolled = false; fetchTick(); }
  lastPerf = p; lastWall = w;
  if (snap && !dayRolled && serverSecNow() >= 24*3600) { dayRolled = true; fetchTick(); }
  render();
  tickTimer = setTimeout(loop, 1000);
}

document.fonts && document.fonts.ready.then(function(){ lastSent = ''; render(); });
render(); loop(); schedule();
toHost({ type:'ready' });
</script>
</body>
</html>
