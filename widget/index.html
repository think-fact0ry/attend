<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>근태</title>
<!--
  근태 데스크톱 위젯 화면 (2026-07-30 신설)
  · 주소 = https://think-fact0ry.github.io/attend/widget/  (폴더형 — 슬래시 유무 둘 다 열림. `.html`은 관성이라 안 씀)
  · 창 자체가 알약이다. 모서리·테두리 색·그림자는 **윈도우가 그린다**(DWM) — CSS로 라운드를 또 그리면
    두 표면이 같은 곡선을 각자 정의해 경계 픽셀이 어긋난다(21차 딤 모서리 6라운드의 근본 사실).
  · 이 파일은 Pages에서 로드된다 = 고치고 push하면 전 PC가 다음 조용한 시점에 반영(exe 재배포 불요).
  · 위젯은 **읽기 전용**이다. 도장·연차는 앱 창(PIN 게이트)이 한다. 서버를 바꾸는 코드를 여기 넣지 말 것.
-->
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
:root{
  /* docs/1 §3.1 정본에서 쓰는 칸만 발췌 */
  --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684;
  --green100:#e9f8ee; --green600:#3a8a5f; --green700:#166841;
  --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#c07f00;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff}
body{
  font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
  user-select:none;word-break:keep-all;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
#pill{
  display:flex;align-items:center;gap:9px;padding:0 15px;position:relative;
  height:34px;flex:0 0 34px;cursor:pointer;transition:opacity .2s;
}
/* ── 펼친 패널 ── */
#panel{display:none;padding:14px 15px 15px;position:relative}
body.open #panel{display:block}
body.open #pill{border-top:1px solid var(--g200);order:2}
#panel .ph{font-size:11.5px;font-weight:700;color:var(--g500);letter-spacing:-.2px}
#panel .pv{font-size:20px;font-weight:800;color:var(--g900);letter-spacing:-.6px;margin:3px 0 12px;font-variant-numeric:tabular-nums}
#panel .pb{display:block;width:100%;border:0;background:var(--green600);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer;letter-spacing:-.3px}
#panel .pb:active{background:var(--green700)}
#panel .pb:disabled{background:#b7e0c8;cursor:default}
#panel .pb.ghost{background:#fff;color:var(--g700);border:1px solid var(--g200);margin-top:7px}
#panel .perr{font-size:12px;color:#f04452;line-height:1.5;margin-top:8px;display:none}
#panel .perr.on{display:block}
body.dim #pill{opacity:.45}                         /* 휴무일 — 흐리게(유성 확정 07-30). 누르는 건 그대로 된다 */
body.moving #pill{cursor:move;opacity:.6}           /* 3초 꾹 눌러 옮기는 중 — 놓으면 그 자리에 고정 */
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green100);transition:width .4s ease}
body.warn #fill{background:var(--warn-weak-bg)}
#dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--g400);flex:0 0 auto;transition:background .2s}
body.on #dot{background:var(--green600)}
body.warn #dot{background:var(--warn)}
#t{position:relative;font-size:14px;font-weight:700;color:var(--g600);letter-spacing:-.4px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
body.on #t{color:var(--green700)}
body.warn #t{color:var(--warn-weak-fg)}
/* 연결이 5분 넘게 안 될 때만 — "고장난 게 아니라 연결이 안 된 것" */
#nc{position:relative;width:5px;height:5px;border-radius:50%;background:var(--g300);flex:0 0 auto;display:none}
body.nc #nc{display:block}
</style>
</head>
<body>
  <div id="pill">
    <div id="fill"></div>
    <span id="dot"></span>
    <span id="t">근태</span>
    <span id="nc" title="연결 안 됨"></span>
  </div>
  <!-- 알약을 누르면 여기가 열린다. 앱 창을 띄우지 않고 바로 도장을 찍기 위한 자리(유성 07-30) -->
  <div id="panel">
    <div class="ph" id="pLabel">오늘 일한 시간</div>
    <div class="pv" id="pVal">근무 전</div>
    <button class="pb" id="pDo">출근</button>
    <button class="pb ghost" id="pOpen">근태 앱 열기</button>
    <div class="perr" id="pErr"></div>
  </div>

<script>
/* ══════════ 설정 ══════════ */
var GAS = 'https://script.google.com/macros/s/AKfycbwNB7J3m_Q0GSYubJf11jpa4DJ8SyUuwU-Ma0r3db446Nl56_yGRkFq_dsaXq5gk70FWQ/exec';
var HB_WORKING = 3 * 60 * 1000;    // 근무 중 3분 — 폰에서 찍은 퇴근을 알아채는 유일한 경로(사전구현 D-6)
var HB_IDLE    = 15 * 60 * 1000;   // 그 밖 15분
var AFTER_OUT_MS = 30 * 60 * 1000; // 퇴근 후 30분 뒤 미출근으로(유성 확정 07-30)
var OFFLINE_MARK_MS = 5 * 60 * 1000;
// 지각 색(주황)을 위젯에도 띄울 것인가 — **기본 꺼짐**.
//   앱 안에서는 본인만 보지만, 위젯은 공용 PC에 하루 종일 떠 있어 옆을 지나는 사람에게도 보인다.
//   위젯의 일은 "아직 안 끝났다"를 알리는 것이지 지각을 표시하는 게 아니다(사전구현 §6 판정 원칙 3 "판정하지 않는다").
//   유성이 원하면 이 한 줄만 true로.
var SHOW_LATE = false;

/* ══════════ 상태 ══════════ */
var auth = null;      // {token, emp} — 호스트(exe)가 넣어준다. 이 페이지는 토큰을 저장하지 않는다
var snap = null;      // 마지막 tick 응답
var snapAt = 0;       // performance.now() — 단조 시계(사용자가 PC 시계를 바꿔도 안 흔들림)
var lastOkAt = 0;     // performance.now() 기준 — 벽시계를 바꿔도 안 흔들림. 0 = 아직 한 번도 성공 못 함
var bootAt = performance.now(); // "한 번도 성공 못 한 채 5분"을 재는 기준.
//   ⚠️선언 시점에 넣는다 — 스크립트 끝에서 대입하면 그 위에 render()가 한 줄만 끼어들어도
//   (lastOkAt||bootAt)=0이 되어 부팅 즉시 '연결 안 됨'이 뜬다. 순서에 기대지 않는다.
var inFlight = false; // 조회가 날아가 있는 중인가 — 겹치면 늦게 출발한 응답이 최신 값을 덮는다(앱 가드 ⑪과 같은 결)
// 절전·시계 점프 감지용. performance.now()는 절전 중 멈추고 Date.now()는 계속 간다 →
//   둘의 증가폭이 크게 벌어지면 "잠들었다 깼다"는 뜻이라 서버와 다시 맞춘다.
//   껍데기(exe)가 wake 신호를 보내주기로 했지만, 그게 없거나 실패해도 화면이 조용히 틀리면 안 된다.
var lastPerf = 0, lastWall = 0;
var dayRolled = false; // 자정을 넘겨 재조회를 이미 한 번 걸었나(요청 폭풍 방지)
var fails = 0;         // 연속 실패 수 — 재시도 간격을 늘리는 데만 씀
var hbTimer = null, tickTimer = null;
var lastSent = '';    // 호스트에 중복 통보 방지

function $(id){ return document.getElementById(id); }

/* 서비스워커 등록 — 이 페이지가 스스로 해야 한다.
   sw.js의 SHELL에 위젯을 넣어 뒀지만 **등록하는 코드가 없으면 캐시가 생기지 않는다**.
   앱 창을 한 번 열어야만 등록되던 상태였고, 그러면 설치 첫날 부팅 시 인터넷이 없을 때
   알약 자리에 브라우저 오류 화면이 뜬다. (scope=/attend/ 라 앱과 같은 워커를 공유) */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js', { scope: '/attend/' }).catch(function(){});
}

/* ══════════ 호스트(exe)와의 대화 ══════════ */
function toHost(o){
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(o));
}
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener('message', function(e){
    var m; try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch(_){ return; }
    if (!m || !m.type) return;
    if (m.type === 'auth')    { auth = m.token ? { token: m.token, emp: m.emp || 'hyeona' } : null; fetchTick(); }
    if (m.type === 'signout') { auth = null; snap = null; render(); }
    if (m.type === 'wake')    { fetchTick(); }   // 절전 복귀·앱 창 닫힘·자정 — 주기와 무관하게 즉시
    if (m.type === 'dragend') { endHold(); }     // 옮기기가 끝났다(마우스를 놓았다) — 이 신호로만 풀 수 있다
  });
}
/* ══════════ 누르기: 짧게=열기 / 3초 꾹=옮기기 (유성 07-30) ══════════
   3초를 채우면 껍데기가 창을 마우스에 붙여 끌고 다니고, 버튼을 놓는 순간 그 자리에 고정된다.
   ⚠️끌기가 시작되면 이 페이지엔 pointerup이 안 온다(마우스를 창이 가져간다) →
     끝났다는 신호는 껍데기가 `dragend`로 알려준다. 그거 없이 클래스를 못 지운다. */
var HOLD_MS = 3000;
var holdT = null, moved = false;

function endHold(){ clearTimeout(holdT); holdT = null; document.body.classList.remove('moving'); }

// ⚠️알약 위에서만 건다 — 패널의 버튼을 3초 누르고 있다가 창이 끌려가면 안 된다
$('pill').addEventListener('pointerdown', function(e){
  if (e.button !== 0) return;
  moved = false;
  clearTimeout(holdT);
  holdT = setTimeout(function(){
    moved = true;                       // 이 뒤에 오는 click은 '열기'가 아니다
    document.body.classList.add('moving');
    toHost({ type: 'drag' });
  }, HOLD_MS);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev){
  $('pill').addEventListener(ev, function(){ if (!moved) endHold(); });
});

/* ══════════ 알약을 누르면 작은 패널이 먼저 열린다 (유성 07-30) ══════════
   앱 창을 띄우지 않고 **여기서 바로 출근·퇴근을 찍는다**. 앱은 [근태 앱 열기]로.
   ⚠️출근은 등록된 회사 PC에서만 된다 — 기기 토큰은 앱과 **같은 출처·같은 프로필**의
     `localStorage.att_dev`에 있으므로 이 페이지가 그대로 읽어 쓴다(새 등록 불필요). */
var open = false, punching = false;

function setOpen(v){
  open = v;
  document.body.classList.toggle('open', open);
  $('pErr').classList.remove('on');
  lastSent = '';           // 창 크기를 다시 알려야 한다
  render();
}
// 휴무일에도 눌리면 열린다 — 흐린 건 "오늘은 할 말이 없다"는 뜻이지 잠긴 게 아니다
$('pill').addEventListener('click', function(){
  if (moved) { moved = false; return; }   // 옮기고 나서 딸려오는 클릭은 삼킨다
  setOpen(!open);
});
$('pOpen').addEventListener('click', function(){ setOpen(false); toHost({ type: 'open' }); });
$('pDo').addEventListener('click', function(){ punch(snap && snap.open ? 'out' : 'in'); });

function punch(kind){
  if (punching || !auth) return;
  punching = true;
  $('pDo').disabled = true;
  $('pErr').classList.remove('on');
  var dev = null;
  try { dev = JSON.parse(localStorage.getItem('att_dev') || 'null'); } catch (e) { }
  var body = {
    action: 'punch', kind: kind, token: auth.token, emp: auth.emp,
    cid: 'w' + Date.now() + Math.random().toString(36).slice(2)
  };
  if (dev && dev.id) { body.device = dev.id; body.deviceToken = dev.token; }
  fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      punching = false; $('pDo').disabled = false;
      if (!r || !r.ok) {
        $('pErr').textContent = (r && r.error) || '기록이 안 됐어요. 다시 눌러 주세요';
        $('pErr').classList.add('on');
        lastSent = ''; render();
        return;
      }
      setOpen(false);      // 찍었으면 접는다 — 알약 색이 곧 결과다
      fetchTick();
    })
    .catch(function(){
      punching = false; $('pDo').disabled = false;
      $('pErr').textContent = '연결이 안 돼요. 잠시 후 다시 눌러 주세요';
      $('pErr').classList.add('on');
      lastSent = ''; render();
    });
}

/* ══════════ 서버 조회 (읽기 전용) ══════════ */
function fetchTick(){
  if (!auth) { render(); schedule(); return; }
  if (inFlight) return;   // 다섯 군데(auth·wake·하트비트·시계점프·자정)에서 불릴 수 있다 — 겹치면 응답 순서가 뒤집힌다
  inFlight = true;
  fetch(GAS, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },   // 단순 요청 — GAS는 preflight(OPTIONS)를 처리 못 함
    body: JSON.stringify({ action: 'tick', token: auth.token, emp: auth.emp })
  })
  .then(function(r){ return r.json(); })
  .then(function(r){
    inFlight = false;
    if (!r || !r.ok) {
      // 토큰이 죽은 것도 '실패'다 — 성공으로 처리하면 15분 타이머가 걸려 그동안 화면이 비어 있다
      if (r && r.code === 'auth') { auth = null; snap = null; toHost({ type: 'need-auth' }); }
      render(); schedule(false); return;
    }
    snap = r; snapAt = performance.now(); lastOkAt = performance.now(); dayRolled = false;
    render(); schedule(true);
  })
  .catch(function(){ inFlight = false; render(); schedule(false); });   // 오프라인 — 짧게 재시도(거짓 숫자 금지)
}
function schedule(ok){
  clearTimeout(hbTimer);
  var wait;
  if (ok === false) {
    // 실패 재시도 = 짧게 시작해 늘린다(20초 → 40초 → 80초에서 고정. fails가 3에서 멈추므로 상한도 80초).
    //   정기 주기(15분)로 물러나면 **부팅 직후 인터넷이 늦게 붙는 흔한 경우에 15분간 틀린 화면**이 된다.
    fails = Math.min(fails + 1, 3);
    wait = Math.min(20000 * Math.pow(2, fails - 1), 120000);
  } else {
    fails = 0;
    wait = (snap && snap.open) ? HB_WORKING : HB_IDLE;
  }
  hbTimer = setTimeout(function(){ fetchTick(); }, wait);
}

/* ══════════ 표시 계산 ══════════ */
function hms2sec(s){
  if (!s) return 0;
  var p = String(s).split(':');
  return (+p[0] || 0) * 3600 + (+p[1] || 0) * 60 + (+p[2] || 0);
}
function fmt(min){
  if (min < 60) return min + '분';
  var h = Math.floor(min / 60), m = min % 60;
  return m ? (h + '시간 ' + m + '분') : (h + '시간');
}
// 지금 서버 시각(초) = 마지막 스냅샷의 서버 시각 + 그 뒤 흐른 단조 시간
function serverSecNow(){
  if (!snap) return 0;
  return hms2sec(snap.nowHms) + Math.floor((performance.now() - snapAt) / 1000);
}

function view(){
  if (!auth || !snap) return { text: '근태', on: false, warn: false, dim: false, gauge: 0 };

  // 자정을 넘겼으면 이전 값은 오늘 것이 아니다 → 미출근으로 보인다.
  //   ⚠️여기서 서버 재조회를 걸지 않는다 — view()는 render()가 1초마다 부르는 **순수 계산**이어야 한다.
  //   재조회는 loop()가 건다(부수효과는 한 곳에).
  if (serverSecNow() >= 24 * 3600) return { text: '근무 전', on: false, warn: false, dim: false, gauge: 0 };

  if (!snap.work) return { text: '휴무일', on: false, warn: false, dim: true, gauge: 0 };

  // 게이지 분모 = 오늘 내가 채워야 하는 양. 연차·병가로 인정된 분은 빼야 한다.
  //   엔진 실판정이 shortMin = planMin - workedMin - leaveMin (근태엔진.js:273)이라
  //   4시간 고정으로 두면 반차 쓴 날 다 채웠는데 절반으로 보인다(사전구현 D-1).
  var need = Math.max(1, (snap.planMin || 0) - (snap.leaveMin || 0));

  // [사무실에서 근무했어요] — 도장이 없어 open이 null이지만 소정근로가 인정된 날(사전구현 D-2).
  //   open 유무로만 판정하면 하루 종일 '미출근'으로 보인다.
  if (snap.external) return { text: '사무실 근무', on: true, warn: false, dim: false, gauge: 100 };

  var worked = snap.workedMin || 0;
  if (snap.open) {   // 근무 중 — 열린 구간을 지금까지 이어서 센다(서버 왕복 0)
    worked += Math.floor(Math.max(0, serverSecNow() - hms2sec(snap.open)) / 60);
    return { text: fmt(worked), on: true, warn: SHOW_LATE && !!snap.late, dim: false, gauge: Math.min(100, worked / need * 100) };
  }
  if (snap.lastOut) {  // 퇴근했다 — 30분 동안만 결과를 보여주고 그 뒤엔 미출근으로 돌아간다
    var since = serverSecNow() - hms2sec(snap.lastOut);
    if (since >= 0 && since * 1000 < AFTER_OUT_MS) {
      return { text: fmt(worked), on: false, warn: false, dim: false, gauge: Math.min(100, worked / need * 100) };
    }
  }
  return { text: '근무 전', on: false, warn: false, dim: false, gauge: 0 };
}

function render(){
  var v = view();
  var b = document.body;
  b.classList.toggle('on', v.on);
  b.classList.toggle('warn', v.warn);
  b.classList.toggle('dim', v.dim);
  // 아직 한 번도 성공 못 했으면 '시작 시점'부터 잰다 — 안 그러면 lastOkAt=0이 falsy라
  //   **부팅 직후 인터넷이 없는 바로 그 경우에 이 표시가 영영 안 뜬다**(이 표시를 만든 이유가 그 경우였다).
  var since = performance.now() - (lastOkAt || bootAt);
  var offline = !!auth && since > OFFLINE_MARK_MS;
  b.classList.toggle('nc', !!offline);
  $('t').textContent = v.text;
  $('fill').style.width = v.gauge + '%';

  // 창 폭 = 좌우 패딩 15+15 + 점 8 + 간격 9 + 글자 + (연결안됨 점 5+간격 9)
  //   getBoundingClientRect 대신 offsetWidth — 레이아웃 값이라 배율·좌표계에 안 흔들린다(§5.5 결)
  var w = 15 + 8 + 9 + $('t').offsetWidth + 15 + (offline ? 14 : 0);

  // 패널 내용 — 알약과 같은 값을 쓰되 문구는 크게
  if (open) {
    var working = !!(snap && snap.open);
    $('pLabel').style.display = (v.on || (snap && snap.lastOut)) ? '' : 'none';
    $('pVal').textContent = v.text;
    $('pDo').textContent = working ? '퇴근' : '출근';
    $('pDo').style.display = (snap && snap.work && !snap.external) ? '' : 'none';
    w = Math.max(w, 232);                       // 패널이 열리면 최소 폭
  }
  var h = 34 + (open ? $('panel').offsetHeight : 0);

  var sig = Math.ceil(w) + 'x' + h + '|' + (v.on ? 1 : 0) + '|' + (v.warn ? 1 : 0) + '|' + (v.dim ? 1 : 0);
  if (sig !== lastSent) {   // 값이 바뀔 때만 알린다(1초마다 창을 흔들지 않게)
    lastSent = sig;
    toHost({ type: 'state', w: Math.ceil(w), h: h, on: v.on, warn: v.warn, dim: v.dim });
  }
}

/* ══════════ 1초 틱 — 표시만 갱신(서버 호출 아님) ══════════ */
function loop(){
  // 절전·시계 점프 감지: 두 시계의 증가폭이 60초 넘게 벌어지면 그 사이 뭔가 있었다는 뜻.
  //   (절전=벽시계만 감 / 시계 수동 변경·NTP 보정=벽시계가 튐) → 스스로 서버와 다시 맞춘다.
  var p = performance.now(), w = Date.now();
  if (lastPerf && Math.abs((w - lastWall) - (p - lastPerf)) > 60000) { dayRolled = false; fetchTick(); }
  lastPerf = p; lastWall = w;
  // 자정 넘김 재조회 — 부수효과는 여기 한 곳에만(view()는 순수 계산). dayRolled로 1회만
  if (snap && !dayRolled && serverSecNow() >= 24 * 3600) { dayRolled = true; fetchTick(); }
  render();
  tickTimer = setTimeout(loop, 1000);
}

/* ══════════ ?demo=1 — 서버 없이 상태를 돌려본다 (앱의 ?demo=1 관례) ══════════
   토큰이 있어야만 숫자가 뜨는 화면이라, 이게 없으면 사람도 Claude도 눈으로 확인할 방법이 없다. */
if (/[?&]demo=1/.test(location.search)) {
  var DEMO = [
    { work:true,  planMin:240, leaveMin:0,   workedMin:0,   open:null,       lastOut:null,      late:false, external:false }, // 근무 전
    { work:true,  planMin:240, leaveMin:0,   workedMin:0,   open:'11:00:00', lastOut:null,      late:false, external:false }, // 방금 출근
    { work:true,  planMin:240, leaveMin:0,   workedMin:63,  open:'11:00:00', lastOut:null,      late:false, external:false }, // 근무 중
    { work:true,  planMin:240, leaveMin:120, workedMin:118, open:'13:00:00', lastOut:null,      late:false, external:false }, // 반차 쓴 날(분모 2시간)
    { work:true,  planMin:240, leaveMin:0,   workedMin:0,   open:null,       lastOut:null,      late:false, external:true  }, // 사무실 근무
    { work:true,  planMin:240, leaveMin:0,   workedMin:240, open:null,       lastOut:'15:00:00',late:false, external:false }, // 퇴근 직후
    { work:false, planMin:0,   leaveMin:0,   workedMin:0,   open:null,       lastOut:null,      late:false, external:false }  // 휴무일
  ];
  var di = 0;
  auth = { token: 'demo', emp: 'demo' };
  fetchTick = function(){};   // 서버 호출 차단
  schedule = function(){};
  setInterval(function(){
    var d = DEMO[di++ % DEMO.length];
    snap = JSON.parse(JSON.stringify(d));
    snap.nowHms = d.open ? '12:03:00' : (d.lastOut ? '15:10:00' : '10:30:00');
    snap.today = '2026-07-30';
    snapAt = performance.now(); lastOkAt = performance.now(); dayRolled = false;
    render();
  }, 2500);
}

document.fonts && document.fonts.ready.then(function(){ lastSent = ''; render(); }); // 폰트 로드 후 폭 재측정
render();
loop();
schedule();
toHost({ type: 'ready' });
</script>
