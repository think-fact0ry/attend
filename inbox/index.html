function recallMsg(seq){
  var id = R.id, m = msgBySeq(seq); if (!id || !m) return;
  var keep = { text: m.text, file: m.file }, c = cid(), t0 = Date.now(), over = false;
  m.rc = 1; m.text = ''; delete m.file; drawThread(seenAll(), true);   // 낙관 — 바로 회색 흔적
  function done(r){
    if (over) return; over = true;
    if (r && r.ok) {
      if (r.sms === 'sent') m.sms = 'sent';
      delete RCACHE[id]; delete FC[id + ':' + seq];
      toastA(RECALL_SAY[r.sms] || RECALL_SAY.none);
    } else {   // 서버가 거절(1분 지남, 남의 줄 등) = 되돌린다
      m.rc = 0; m.text = keep.text; if (keep.file) m.file = keep.file;
      toastA((r && r.error) || '거두지 못했어요');
    }
    if (R.id === id) drawThread(seenAll(), true);
    S.gver = ''; poll();
  }
  function askJob(){
    if (Date.now() - t0 > 60000) { if (!over) { over = true; toastA('결과를 아직 못 받았어요. 대화를 다시 열어 보세요'); } return; }
    setTimeout(function(){
      ask({ action:'s_job', auth: me, cid: c }).then(function(j){
        if (j && j.ok && j.state === 'done') { done(j.result); return; }
        if (j && j.ok && j.state === 'none') { send(); return; }   // 서버에 안 닿았다 = 같은 번호로 다시(거두기는 두 번 와도 같은 결과 — 26 again)
        askJob();
      }, askJob);
    }, 4000);
  }
  function send(){ ask({ action:'s_recall', auth: me, id: id, seq: seq, cid: c }).then(function(r){ if (!r || r.code === 'run') { askJob(); return; } done(r); }, askJob); }
  send();
}
/* ══════════ 보낸 답장 고치기(10-23 저녁 유성 「관리자는 보낸 글을 수정할 수 있도록 할것. 수정됨 이라는 표시는 넣지 않을것. 수정하면 딜레이 없이 즉시 수정되게 할 것.」) ══════════
   · 한유성(관리자 보기)만 — 26 INQ_EDIT_ROLES와 같은 범위. 내 말풍선(글 있는 줄) 오른쪽 클릭 「고치기」 → 입력 칸에 그 글 + 위에 「답장 고치기」 줄.
     보내기(엔터) = 고침, Esc나 「취소」 = 그만(쓰던 글, 첨부 칩은 돌아옴). 시간 제한 없음(거두기는 1분).
   · 낙관 = 누르는 순간 말풍선 글이 바뀐다. 26 s_edit(작업 번호 — 응답을 놓치면 s_job으로 결과만). 학부모 창은 다음 묻기(3초)에 바뀐 글, 「수정됨」 표시 0.
   · 주기 조회가 반영 전 대화를 다시 가져와도 서버가 같은 글을 보일 때까지 내 글을 지킨다(EDH — 받은함 지키기 표와 같은 규칙, 답 받은 뒤 30초 상한).
   · 문자가 이미 나간 줄이면 「문자로는 고치기 전 글이 갔어요」(26 sms:'sent') */
var ED = null, EDH = {};   // ED = 고치는 중 {id, seq, draft, att} · EDH = '방:줄' → {t, at, done}
var EDIT_MS = 30000;
function editable(m){ return VIEWER && !!m && !m.rc && !m.pending && !m.unknown && !m.failed && m.seq > 0 && m.seq < 1e9 && m.who === MY_WHO && !!(m.text || '').trim(); }
function edApply(id, msgs){   // 서버에서 받은 줄에 내 고친 글을 다시 얹는다(받은 직후, 그리기 전)
  (msgs || []).forEach(function(m){
    var k = id + ':' + m.seq, h = EDH[k]; if (!h) return;
    if (m.text === h.t) { if (h.done) delete EDH[k]; return; }   // 서버가 따라왔다
    if (h.done && Date.now() - h.at > EDIT_MS) { delete EDH[k]; return; }
    if (!m.rc) m.text = h.t;
  });
  return msgs;
}
function edPatch(id, seq, t){ var c = RCACHE[id]; if (c) c.msgs.forEach(function(m){ if (m.seq === seq && !m.rc) m.text = t; }); }
function editStart(seq){
  var m = msgBySeq(seq); if (!editable(m)) return;
  if (ED) editStop();
  fqClose();
  ED = { id: R.id, seq: seq, draft: ta.value, att: ATT };
  ATT = []; drawAtts();
  ta.value = m.text; autosize(); syncSend();
  $('rEdT').textContent = String(m.text || '').split('\n')[0];
  $('rEd').classList.add('on');
  drawThread(seenAll(), false);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function editStop(){   // 그만 = 입력 칸을 고치기 전으로(쓰던 글, 첨부 칩)
  if (!ED) return;
  var e = ED; ED = null;
  $('rEd').classList.remove('on');
  if (R.id !== e.id) return;
  ta.value = e.draft; ATT = e.att || []; drawAtts(); autosize(); syncSend();
  drawThread(seenAll(), false);
}
function editSend(){
  var e = ED, m = e && msgBySeq(e.seq), v = ta.value.replace(/\s+$/, '').replace(/^\s+/, '');
  if (!e || !m || !v) return;
  if (v === (m.text || '')) { editStop(); return; }   // 안 바뀜 = 서버를 안 부른다
  var id = e.id, seq = e.seq, keep = m.text, c = cid(), t0 = Date.now(), over = false, k = id + ':' + seq;
  var h = EDH[k] = { t: v, at: Date.now(), done: false };
  m.text = v; edPatch(id, seq, v);
  var vis = R.msgs.filter(function(x){ return !x.rc && !x.failed; }), row = findRow(id);
  if (row && vis.length && vis[vis.length - 1].seq === seq) row.preview = v.slice(0, 60);   // 마지막 줄 = 목록 미리보기도(26이 같이 바꾼다)
  editStop();
  function done(r){
    if (over) return; over = true;
    if (r && r.ok) {
      if (EDH[k] === h) { h.done = true; h.at = Date.now(); }
      if (r.sms === 'sent') toastA('문자로는 고치기 전 글이 갔어요');
    } else {   // 거절(거둔 줄 등) = 되돌린다 — 그 뒤에 또 고쳤으면 손대지 않음
      if (EDH[k] === h) {
        delete EDH[k];
        var mm = R.id === id ? msgBySeq(seq) : null; if (mm && mm.text === v) mm.text = keep;
        edPatch(id, seq, keep);
        if (R.id === id) drawThread(seenAll(), false);
      }
      toastA((r && r.error) || '고치지 못했어요');
    }
    S.gver = ''; poll();
  }
  function askJob(){
    if (Date.now() - t0 > 60000) { if (!over) { over = true; toastA('결과를 아직 못 받았어요. 대화를 다시 열어 보세요'); } return; }
    setTimeout(function(){
      ask({ action:'s_job', auth: me, cid: c }).then(function(j){
        if (j && j.ok && j.state === 'done') { done(j.result); return; }
        if (j && j.ok && j.state === 'none') { send(); return; }   // 서버에 안 닿았다 = 같은 번호로 다시(같은 글로 두 번 고쳐도 같은 결과)
        askJob();
      }, askJob);
    }, 4000);
  }
  function send(){ ask({ action:'s_edit', auth: me, id: id, seq: seq, text: v, cid: c }).then(function(r){ if (!r || r.code === 'run') { askJob(); return; } done(r); }, askJob); }
  send();
}
$('rEdX').addEventListener('click', function(){ editStop(); ta.focus(); });
/* 내가 바꾼 칸 지키기(10-18 유성 「이름 수정하기 해서 이름을 수정했을 때 그 즉시 수정되지 않고 조금 딜레이」)
   실측: 이름을 저장한 직후 다른 대화 변화(읽음, 새 글, 박동)로 새 목록이 오면 서버엔 아직 옛 이름이라 새 이름 → 1.6초 옛 이름 → 6.6초 새 이름으로 깜빡였다.
   → 내가 바꾼 이름·고정은 서버 목록이 같은 값을 보여 줄 때까지(답을 받은 뒤, 최대 30초) 내 값으로 둔다. 서버가 거절하면 바로 지우고 다시 받는다(옛 값으로 = 맞음).
   맡기·돌려놓기는 서버가 고정을 푸니 그 줄의 고정 지키기도 지운다. 요청마다 표(h) = 연달아 바꾸면 마지막 요청의 답만 반영(첫 답이 둘째 값을 덮지 않게).
   own = 맡기·돌려놓기(같은 날 「아직 안 고친 것은 고칠것」) — 실측: 맡기만 해도 1.0초 내 대화 → 2.7초 사라짐 → 7.7초 다시(카드 누름의 읽음, 방 열기가
   목록 판을 올려 맡기 반영 전 목록이 온다), 돌려놓기 = 1.3초 대기 → 2.9초 원래 칸 → 4.7초 대기. → 서버가 따라올 때까지 그 줄을 내가 옮긴 칸에 둔다. */
var HOLD_MS = 30000;
function holdSet(id, k, v, name){ var o = S.hold[id] || (S.hold[id] = {}); return (o[k] = { v: v, name: name || '', at: Date.now(), done: false }); }
function holdDone(id, k, h, v){ var o = S.hold[id]; if (!o || o[k] !== h) return false; h.done = true; h.at = Date.now(); if (v !== undefined) h.v = v; return true; }   // false = 그 뒤에 또 바꿈
function holdDrop(id, k, h){ var o = S.hold[id]; if (!o || (h && o[k] !== h)) return; delete o[k]; if (!Object.keys(o).length) delete S.hold[id]; }   // h 없음 = 무조건(맡기·돌려놓기)
function holdApply(){
  var now = Date.now();
  Object.keys(S.hold).forEach(function(id){
    var o = S.hold[id], r = findRow(id);
    Object.keys(o).forEach(function(k){
      var h = o[k];
      if (now - h.at > HOLD_MS) { delete o[k]; return; }
      if (!r) return;
      if (k === 'done' && h.v && h.done && r.dn && !r.dn.on) { delete o[k]; return; }   // 서버가 완료를 받은 뒤 학부모가 또 보냄(dn 있고 on 0) = 옛 목록이 아니라 새 사실 — 체크를 붙잡지 않는다(10-28)
      var cur = k === 'pin' ? (+r.pin ? 1 : 0) : k === 'own' ? (r.owner || '') : k === 'done' ? (isDone(r) ? 1 : 0) : (r[k] || '');
      if (cur === h.v) { if (h.done) delete o[k]; return; }   // 서버가 따라왔다
      if (k === 'own') {   // 칸 옮기기 = claim·release의 낙관과 같게(맡거나 돌려놓으면 고정은 풀린다, 옮긴 칸 맨 위)
        S.wait = S.wait.filter(function(x){ return x !== r; }); S.mine = S.mine.filter(function(x){ return x !== r; });
        r.owner = h.v; r.pin = 0; r.pinName = ''; (h.v ? S.mine : S.wait).unshift(r);
      }
      else if (k === 'pin') { r.pin = h.v; if (!r.owner) r.pinName = h.v ? h.name : ''; }
      else if (k === 'done') { if (h.v) { r.dn = h.name; r.unread = 0; } else r.dn = null; }   // h.name = 낙관 완료 칸(아래 setDone)
      else r[k] = h.v;
    });
    if (!Object.keys(o).length) delete S.hold[id];
  });
}
// 고정 — 바로 칩·순서를 바꾸고(낙관) 서버가 거절하면 토스트 + 목록 다시 받기
function setPin(r, on){
  r.pin = on ? 1 : 0;
  if (!r.owner) r.pinName = on ? (VIEWER ? '한유성' : ((me && me.name) || '행정')) : '';   // 행정 서명엔 이름이 실려 있다(19 _inqSig_)
  var hd = holdSet(r.id, 'pin', on ? 1 : 0, r.pinName);
  renderFlip();
  toastA(on ? '맨 위에 고정했어요' : '고정을 풀었어요');
  ask({ action:'s_pin', auth: me, id: r.id, on: on, cid: cid() }).then(function(res){
    if (res && res.ok) { holdDone(r.id, 'pin', hd); return; }
    holdDrop(r.id, 'pin', hd); toastA((res && res.error) || '고정하지 못했어요'); S.gver = ''; poll();
  }).catch(function(){ holdDrop(r.id, 'pin', hd); toastA('연결이 안 돼요'); S.gver = ''; poll(); });
}
// 상담 완료(10-28 유성 「그 채팅을 마우스 오른쪽 클릭한 뒤 상담 완료하기 … 초록색 원에 흰색 체크 … 또 한번 문의채팅이 오면 그 v는 사라지고 숫자」 → 검토 Q1 a·Q2 a·Q3 b(→ D)·Q4 a, 체크 B)
//   = 표시만(대화·순서·학부모 「읽음」 그대로). 바로 체크·숫자 0·2분 넘음 풀림(낙관), 서버가 거절하면 토스트 + 목록 다시 받기.
//   행정이 대기 줄을 완료하면 맡기와 같은 빨려 들기 뒤 내 대화로(26 s_done이 맡기까지 — s_claim은 안 부름), 탭은 안 바꿈(볼 일이 끝난 방)
function setDone(r, on){
  var id = r.id, claimIt = on && !VIEWER && !r.owner;
  var dn = on ? { at: new Date(nowS()).toISOString(), nm: VIEWER ? '한유성' : ((me && me.name) || '행정'), seq: r.dn && r.dn.on ? r.dn.seq : -1, on: 1 } : null;   // seq -1 = 서버 줄 번호가 올 때까지 대화방 맨 끝
  var go = function(){
    var cur = findRow(id) || r;
    cur.dn = dn; if (on) cur.unread = 0;
    var hd = holdSet(id, 'done', on ? 1 : 0, dn), ho = null;
    if (claimIt) {
      S.wait = S.wait.filter(function(x){ return x !== cur; });
      if (S.mine.indexOf(cur) < 0) { cur.owner = me.emp; cur.pin = 0; cur.pinName = ''; S.mine.unshift(cur); }   // 맡으면 대기 고정은 풀린다(26 규칙)
      holdDrop(id, 'pin'); ho = holdSet(id, 'own', me.emp);
    }
    renderFlip(); if (R.id === id && R.loaded) drawThread(seenAll(), false);
    toastA(on ? '상담 완료로 표시했어요' : '상담 완료를 풀었어요');
    ask({ action:'s_done', auth: me, id: id, on: on, cid: cid() }).then(function(res){
      if (res && res.ok) { holdDone(id, 'done', hd); if (ho) holdDone(id, 'own', ho); return; }
      holdDrop(id, 'done', hd); if (ho) holdDrop(id, 'own', ho);
      toastA((res && res.error) || (on ? '상담 완료로 표시하지 못했어요' : '상담 완료를 풀지 못했어요')); S.gver = ''; poll();
    }).catch(function(){ holdDrop(id, 'done', hd); if (ho) holdDrop(id, 'own', ho); toastA('연결이 안 돼요'); S.gver = ''; poll(); });
  };
  var it = claimIt && $('list').querySelector('.it[data-id="' + CSS.escape(id) + '"]');
  if (it) flyTo(it, id, 'mine', go); else go();
}
// 이름 칸 — 그린 뒤 붙인다. Enter 저장(한글 조합 중 Enter는 무시), Esc 취소, 밖을 누르면 저장, ↩ = 원래 이름으로
function bindRen(){
  var inp = $('list').querySelector('.ren'); if (!inp) return;
  inp.focus(); inp.select();

    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); S.editing = ''; render(); }
  });
  inp.addEventListener('blur', function(){ if (S.editing) saveLabel(inp.value); });

  if (!$('room').classList.contains('on') || !R.id || R.ext || !document.body.classList.contains('fileon')) return;   // 카드 방 = 첨부 없음(붙일 곳이 없다)
  var cd = e.clipboardData; if (!cd || !cd.files || !cd.files.length) return;
  if ((cd.getData('text/plain') || '').trim()) return;
  e.preventDefault(); addFiles(cd.files, true);
});
// 끌어다 놓기 = 대화방 어디든. 놓을 수 없는 곳(목록)에 떨어뜨려도 창이 그 파일로 넘어가지 않게(브라우저 기본 = 파일 열기 → 쓰던 답장이 날아감)
(function(){
  var room = $('room'), depth = 0;
  function hasFiles(e){ var t = e.dataTransfer && e.dataTransfer.types; return !!t && [].indexOf.call(t, 'Files') >= 0; }
  room.addEventListener('dragenter', function(e){ if (!hasFiles(e) || !R.id || R.ext || !document.body.classList.contains('fileon')) return; e.preventDefault(); depth++; room.classList.add('dragging'); });
  room.addEventListener('dragover', function(e){ if (!hasFiles(e) || !R.id) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  room.addEventListener('dragleave', function(e){ if (!hasFiles(e)) return; if (--depth <= 0) { depth = 0; room.classList.remove('dragging'); } });
  room.addEventListener('drop', function(e){ if (!hasFiles(e)) return; e.preventDefault(); depth = 0; room.classList.remove('dragging'); if (R.id && !R.ext) addFiles(e.dataTransfer.files); });
  ['dragover', 'drop'].forEach(function(ev){ window.addEventListener(ev, function(e){ if (hasFiles(e)) e.preventDefault(); }); });
})();

function getFile(k){
  var c = FC[k]; if (c) return c.url ? Promise.resolve(c) : c.p;
  var i = k.lastIndexOf(':'); if (i < 0) return Promise.reject(new Error('nokey'));
  var id = k.slice(0, i), seq = +k.slice(i + 1);
  var once = function(){ return ask({ action:'s_file', auth: me, id: id, seq: seq }, FILE_TIMEOUT_MS); };
  c = FC[k] = {};
  c.p = once().catch(function(e){ if (e && e.bad) return once(); throw e; }).then(function(r){   // 구글 HTML이면 한 번만 다시(큰 응답이라 4초 헤지는 안 씀 — 같은 파일을 두 번 받게 된다)
    if (!r || !r.ok || !r.b64) throw new Error((r && r.error) || 'nofile');
    var bin = atob(r.b64), u = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
    c.url = URL.createObjectURL(new Blob([u], { type: r.t })); c.t = r.t; c.n = r.n; return c;
  });

}

/* ══════════ 자주 쓰는 답변(⑤ 10-23 첫 판 + 같은 날 저녁 유성 피드백 — 정본 = 생각공작소 prototype/26_문의채팅_자주쓰는답변_첫화면질문_사전계획_프리뷰.html ⑤ 탭, 서버 = 26 자주답변.js, 글 = tools/문의답변/정본.js) ══════════
   · 클립 옆 말풍선 단추 → 목록. 26이 faq:1을 주는 판일 때만 단추(구판에 s_faq를 부르면 「알 수 없는 요청」).
   · 목록 = 「기본 답변」(정본 — 못 빼고 못 고침, 26도 거절) / 「저장한 답변」(행정이 저장 — 제목, 글 고치기 + 빼기). 두 칸을 갈라 그린다(유성 「기본으로 저장되어있는 건 삭제하지 못하게 하고 … 비교가 되어야함」).
   · 순서 = 학부모 글(우리 마지막 답 앞뒤로 가장 가까운 학부모 줄들) × 낱말 사전. 띄어쓰기 빼고 맞춤, 둘 이상 맞으면 1.5배, 서비스 이름이 나오면 그 서비스 갈래가 위로, 다른 서비스 갈래는 아래로. AI 호출 0(유성 10-15 2차).
   · 찾기(유성 「자주 쓰는 답변 우측 상단에 검색 … 그 키워드 분석해서 답변 우선순위로」) = 머리 오른쪽 칸. 친 글을 띄어쓰기로 나눠 낱말마다 제목 5, 글 2, 사전 낱말(그 낱말을 품거나 낱말이 품으면) 사전 점수 → 여럿 맞으면 1.5배,
     서비스 이름을 쳤으면 그 서비스 갈래 +3, 다른 갈래 −3. 0점 = 안 보임. 같은 점수 = 원래 순서
   · 넣기 = 입력 칸을 비우고 넣는다(유성 「인풋 창에 있는 텍스트들을 없애고 넣어져야해. 실수할 수 있음」 — kbFill이 insertText라 Ctrl+Z로 쓰던 글이 돌아온다).
     그 대화에 우리 답장이 아직 없으면(거둔 답장은 안 셈, 앞 줄이 더 있으면 있는 셈) 앞에 「네 안녕하세요! 」 — 답이 「안녕하세요」나 「네, 」 「네~」로 시작하면 안 붙임.
   · 저장 = 목록 맨 아래 「새 답변 만들기」(쓰던 글이 있으면 그 글로 채워 열림) / 우리 말풍선 오른쪽 클릭 「자주 쓰는 답변에 넣기」 → 같은 만들기 칸(제목 + 내용, 제목 = 첫 문장으로 미리 채움).
     ⛔그 대화 이름표, 닉네임, 아이 이름, 선생님 이름, 전화번호가 든 글은 안 넣는다(목록은 모든 대화에 뜬다 — 번호는 26도 한 번 더 거름).
   · 저장한 답 = 줄에 마우스를 올리면 고치기, 빼기 단추(오른쪽 클릭 메뉴도 같음). 빼기는 제목을 넣은 확인 창을 한 번(유성 「그 답변의 제목을 언급하면서 뺄지 묻는 모달」 — §4.4, 빼기 = danger).
     저장, 고치기, 빼기는 낙관(바로 목록에) — 26이 거절하면 되돌리고 토스트. 넣은 답을 보내면 26에 한 번(그대로 / 고쳐서) — 자주 고쳐 보내는 답 = 안 맞는 답(유성 10-15 「행동으로 찾기」) */
var FQ = { data: null, at: 0, p: null, open: false, ins: null, sel: -1, rows: [], fresh: '', q: '', ed: null };   // ins = 마지막으로 넣은 답 {id, room, text} · fresh = 방금 저장한 줄(한 번 반짝) · q = 찾기 글 · ed = 만들기, 고치기 칸 {id(고치기면), t, a, from}
var I_FAQADD = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6"/><path d="M9 10h6"/></svg>';
var I_FAQDEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';
var I_FAQED = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
var FQ_FV = 2;   // 이 받은함 판(10-26) = 인사 줄 고르기, 〔칸〕 채우기, 못 채우면 보내기 멈춤을 안다 → 26 _sFaq_가 정본 fv 2 줄을 준다(옛 받은함 = fv 1 줄만)
var FQ_GREET = '네 안녕하세요! ', FQ_PHONE = /01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/, FQ_GREET_RE = /^(네[,\s]*)?안녕하세요[!.,~\s]*/, FQ_TMAX = 30;
var fqFade = null, fqEdFade = null;
function fqLoad(force){
  if (FQ.p && !force) return FQ.p;
  var p = FQ.p = askRead({ action:'s_faq', auth: me, fv: FQ_FV }).then(function(r){ if (!r || !r.ok) throw new Error((r && r.error) || 'faq'); FQ.data = r; FQ.at = Date.now(); return r; });
  p.catch(function(){ if (FQ.p === p) FQ.p = null; });   // 못 받았으면 다음에 다시

function fqNorm(t){ return String(t || '').replace(/\s+/g, '').toLowerCase(); }
function fqAsked(){   // 학부모 글 = 끝에서부터 우리 줄은 건너뛰고, 학부모 줄을 만나면 그 앞 우리 줄까지(최대 6줄)
  var out = [];
  for (var i = R.msgs.length - 1; i >= 0 && out.length < 6; i--) {
    var m = R.msgs[i]; if (m.rc) continue;
    if (m.who !== 'v') { if (out.length) break; continue; }
    out.unshift(m.text || '');
  }
  return fqNorm(out.join(' '));
}
function fqScore(row, txt, hit, any){
  var kw = row.kw, sc = 0, n = 0;
  if (!kw || !txt) return 0;
  for (var k in kw) if (Object.prototype.hasOwnProperty.call(kw, k) && txt.indexOf(fqNorm(k)) >= 0) { sc += +kw[k] || 0; n++; }
  if (n >= 2) sc *= 1.5;
  if (sc > 0 && typeof row.svc === 'string') sc += row.svc ? (hit[row.svc] ? 3 : any ? -3 : -0.5) : (any ? -2 : 0.5);
  return sc;
}
function fqTitleOf(a){ var one = String(a || '').replace(/\s+/g, ' ').trim(), cut = one.search(/[.?!](\s|$)/); return Array.from(cut > 0 && cut < 30 ? one.slice(0, cut + 1) : one.slice(0, 24)).slice(0, FQ_TMAX).join(''); }   // 제목 없는 저장 답(10-23 첫 판) = 첫 문장
function fqBaseRow(b, i){ return { id: b.id, t: b.t, p: b.a.split('\n')[0], a: b.a, kw: b.kw, svc: b.svc, g: b.g, fit: b.fit, i: i }; }
function fqMineRow(m, i){ var one = m.a.replace(/\s+/g, ' ').trim(), t = m.t || fqTitleOf(m.a); return { id: m.id, t: t, tt: m.t || '', p: m.t ? one : (one.slice(t.length).trim() || one), a: m.a, mine: 1, i: 1000 + i }; }
function fqOrder(){   // 찾기 칸이 비었을 때 = 그 대화 학부모 글 순서 → [{id, t(제목), p(첫 줄), a(넣을 글), mine}]
  var d = FQ.data; if (!d) return [];
  var txt = fqAsked(), hit = {}, any = 0;
  Object.keys(d.svc || {}).forEach(function(c){ var kw = d.svc[c]; for (var k in kw) if (txt && txt.indexOf(fqNorm(k)) >= 0) { hit[c] = 1; any = 1; break; } });
  var base = (d.base || []).map(function(b, i){ var x = fqBaseRow(b, i); x.sc = fqScore(b, txt, hit, any); if (x.sc > 0 && b.fit) x.sc += fqFit(b); return x; });
  var on = base.filter(function(x){ return x.sc > 0; }).sort(function(x, y){ return y.sc - x.sc || x.i - y.i; });
  var off = base.filter(function(x){ return !(x.sc > 0); });
  return on.concat(off, (d.mine || []).map(fqMineRow));
}
function fqHit(tk, n){ return !!n && (tk.indexOf(n) >= 0 || (tk.length >= 2 && n.indexOf(tk) >= 0)); }   // 친 낱말이 사전 낱말을 품거나(「본인부담금은」 ⊃ 「본인부담」) 사전 낱말이 친 낱말을 품음(「부담」)
function fqFind(q){   // 찾기 = 친 낱말 분석 → 점수 높은 순(위 머리말). 0점은 뺀다
  var d = FQ.data; if (!d) return [];
  var toks = String(q).split(/\s+/).map(fqNorm).filter(Boolean);
  if (!toks.length) return fqOrder();
  var svcHit = {}, anySvc = 0;
  Object.keys(d.svc || {}).forEach(function(c){ var kw = d.svc[c]; toks.forEach(function(tk){ for (var k in kw) if (fqHit(tk, fqNorm(k))) { svcHit[c] = 1; anySvc = 1; } }); });
  var all = (d.base || []).map(fqBaseRow).concat((d.mine || []).map(fqMineRow));
  all.forEach(function(x){
    var t = fqNorm(x.t), a = fqNorm(x.a), sc = 0, n = 0;
    toks.forEach(function(tk){
      var s = (t.indexOf(tk) >= 0 ? 5 : 0) + (a.indexOf(tk) >= 0 ? 2 : 0);
      if (x.kw) for (var k in x.kw) if (Object.prototype.hasOwnProperty.call(x.kw, k) && fqHit(tk, fqNorm(k))) s += +x.kw[k] || 0;
      if (s > 0) n++;
      sc += s;
    });
    if (n >= 2) sc *= 1.5;
    if (sc > 0 && anySvc && typeof x.svc === 'string') sc += x.svc ? (svcHit[x.svc] ? 3 : -3) : -1;
    if (sc > 0 && x.fit) sc += fqFit(x);   // 띠 아이에 맞는 갈래를 위로(10-26, 찾기 순서와 같은 규칙)
    x.sc = sc;
  });
  return all.filter(function(x){ return x.sc > 0; }).sort(function(x, y){ return y.sc - x.sc || x.i - y.i; });
}
function fqHl(s, toks){   // 제목에서 친 낱말(가장 긴 것) 하나를 초록 굵게
  var at = -1, len = 0;
  toks.forEach(function(tk){ var j = s.indexOf(tk); if (j >= 0 && tk.length > len) { at = j; len = tk.length; } });
  return at < 0 ? esc(s) : esc(s.slice(0, at)) + '<mark>' + esc(s.slice(at, at + len)) + '</mark>' + esc(s.slice(at + len));
}
function fqShell(){   // 목록 틀(머리 + 찾기 칸 + 스크롤 칸 + 새 답변 만들기) = 한 번만 — 다시 그릴 땐 줄만(찾기 칸 글자, 포커스 그대로)
  var L = $('rFql');

    '<div class="sw" id="fqSw"><div class="fs" id="fqS" role="listbox"></div></div>' +
    '<button type="button" class="fa" data-f="new"><svg class="li" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>새 답변 만들기</button>';
  $('fqQ').value = FQ.q;
  fqFade = fadeWatch($('fqS'), $('fqSw'));
}
function fqDraw(){
  if (FQ.ed) { fqDrawEd(); return; }
  fqShell();
  var box = $('fqS'), d = FQ.data;
  if (!d) { FQ.rows = []; box.innerHTML = '<div class="fe">' + (FQ.p ? '불러오는 중<span class="ldd"><i></i><i></i><i></i></span>' : '목록을 아직 못 불러왔어요. 다시 눌러 주세요') + '</div>'; return; }
  var q = FQ.q.trim(), list = q ? fqFind(q) : fqOrder(), toks = q.split(/\s+/).filter(Boolean);
  var base = list.filter(function(x){ return !x.mine; }), mine = list.filter(function(x){ return x.mine; });
  FQ.rows = base.concat(mine);
  if (FQ.sel >= FQ.rows.length) FQ.sel = FQ.rows.length - 1;
  var n = 0;
  var row = function(x){
    var k = n++, sel = k === FQ.sel ? ' sel' : '';
    return '<div class="fw' + (x.mine ? ' mine' : '') + sel + '" data-i="' + k + '"><button type="button" class="fi' + sel + (x.id === FQ.fresh ? ' new' : '') + '" data-i="' + k + '" role="option"><b>' + fqHl(x.t, toks) + '</b><span>' + esc(x.p) + '</span></button>' +
      (x.mine ? '<span class="fx"><button type="button" data-f="ed" data-i="' + k + '" title="고치기" aria-label="고치기">' + I_FAQED + '</button><button type="button" class="del" data-f="del" data-i="' + k + '" title="빼기" aria-label="빼기">' + I_FAQDEL + '</button></span>' : '') + '</div>';
  };
  var html = !FQ.rows.length ? '<div class="fe">맞는 답변이 없어요</div>'

  cm.innerHTML = '<button type="button" role="menuitem" data-a="faqed">' + I_FAQED + '고치기</button><button type="button" role="menuitem" data-a="faqdel">' + I_FAQDEL + '빼기</button>';
  cm.classList.add('on');
  var ar = $('app').getBoundingClientRect(), px = e.clientX - ar.left, py = e.clientY - ar.top;
  if (!e.clientX && !e.clientY) { var br = b.getBoundingClientRect(); px = br.left - ar.left + 40; py = br.bottom - ar.top - 8; }
  cm.style.left = Math.max(8, Math.min(px, ar.width - cm.offsetWidth - 8)) + 'px';
  cm.style.top = Math.max(8, Math.min(py, ar.height - cm.offsetHeight - 8)) + 'px';
});
function fqRowById(id){ for (var i = 0; i < FQ.rows.length; i++) if (FQ.rows[i].id === id) return FQ.rows[i]; return null; }
document.addEventListener('pointerdown', function(e){ if (FQ.open && !e.target.closest('#rFql') && !e.target.closest('#rFaq') && !e.target.closest('#cm') && !e.target.closest('#fqDlg') && !e.target.closest('#fqDim')) fqClose(); }, true);
document.addEventListener('keydown', function(e){
  if ($('fqDlg').classList.contains('on')) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fqDlgClose(); } return; }
  if (!FQ.open || $('cm').classList.contains('on')) return;
  if (FQ.ed) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fqEdCancel(); return; }
    if (e.key === 'Enter' && e.target.id === 'fqT') { e.preventDefault(); e.stopPropagation(); var A = $('fqA'); A.focus(); A.setSelectionRange(A.value.length, A.value.length); return; }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.stopPropagation(); fqEdSave(); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (FQ.q) { FQ.q = ''; $('fqQ').value = ''; FQ.sel = -1; fqDraw(); return; } fqClose(); ta.focus(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); var n = FQ.rows.length; if (!n) return; FQ.sel = e.key === 'ArrowDown' ? (FQ.sel + 1) % n : (FQ.sel <= 0 ? n - 1 : FQ.sel - 1); fqDraw(); var sl = $('rFql').querySelector('.fi.sel'); if (sl) sl.scrollIntoView({ block: 'nearest' }); return; }
  if (e.key === 'Enter' && !e.isComposing && FQ.sel >= 0 && FQ.rows[FQ.sel]) { e.preventDefault(); e.stopPropagation(); fqPut(FQ.rows[FQ.sel]); }
}, true);
function toastA(t){ var a = $('atoast'); a.textContent = t; a.classList.add('on'); clearTimeout(a._t); a._t = setTimeout(function(){ a.classList.remove('on'); }, 2200); }

/* ══════════ 시작 ══════════ */
if (VIEWER) $('seg').querySelector('[data-t="mine"]').firstChild.nodeValue = '맡은 대화';   // 한유성은 맡지 않으니 「내 대화」가 아니다 — 행정 빈 칸 글자 「맡은 대화가 없어요」와 같은 말
if (!me) dead('이 컴퓨터 알약에서 근태에 한 번 들어가면 문의가 보여요');
else poll();
// 「2분 넘음」은 시간이 지나며 바뀐다 — 서버를 안 불러도 30초마다 다시 그린다
setInterval(function(){ if (!$('room').classList.contains('on')) render(); }, 30000);
</script>
