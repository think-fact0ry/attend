<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검사 결과 발송</title>
<!--
  검사 결과 발송 v159 (2026-11-26 — 시안 6판대로 다시 지음. 유성 11-25 「워크플로우와 와이어프레임을 나와 같이 고민하고 결정해야지」 → 흐름 B 「권장대로」 → 시안 1~6판 → 「go」)
  · 무엇 = 첫 화면에 「보낼 결과지」 카드(결과지 폴더에 저장됐는데 아직 안 보낸 아동 단계) + 「확인할 파일」(같은 이름 아동, 서류철에 없는 이름) + 「최근 보낸 결과지」(30일).
    카드 오른쪽 칸(84×100)을 눌러 고르고 아래 바 「N명 결과지 보내기」 → 아동마다 07이 사본 + 장부 한 줄(열쇠) + 알림톡(버튼 = kr /result/?k=열쇠, 보호자가 아이 생년월일로 엶).
    카드를 누르면 아래 시트(파일 고르기, 앞 판, 보낸 판, 휴대폰 번호). 보낸 결과지 → 시트(보호자가 받음, 열어 봄, 지난 링크 닫기, 다시 보내기). 확인할 파일 → 「이 아동인가요」(07이 파일 이름 끝에 생년을 붙임).
  · 서버 = 생각공작소 scripts/07_아동서류화일관리/결과지발송.js — rs_list(목록, q = 검색), rs_phones, rs_file(열기), rs_fix, rs_send, rs_res, rs_off. 요청마다 v:3(07 RS_SCREEN_V3 — 옛 07이면 rs_list = action = 꺼짐).
  · 정본 = 생각공작소 prototype/07_검사결과지_화면시안/app.html(6판), prototype/07_검사결과지_짓기계획_프리뷰.html(실물이 바꾼 규칙 둘), docs/6_백로그_원장_검사결과지발송.md.
  · 근태 앱(attend/index.html)의 「검사 결과 발송」 화면 안 창(iframe)으로만 산다 — 예약(booking/)과 같은 틀(창 신호는 부모를 거침, 따로 열리면 앱으로 돌려보냄).
  · 신원 = 문의 채팅과 같은 서명(att_inq — 19가 등록 PC + 한유성 폰에서만 줌). 07이 같은 키(INQ_KEY)로 확인. 07이 서명을 안 받으면(auth, 옛 배포) 꺼짐 → 앱에 off(메뉴 칸 숨김), 10분마다 다시.
  · 보내기 = 아동마다 작업 번호 하나(한 번에 셋까지 동시). 같은 번호는 「응답을 놓쳤을 때」만(시한, 구글 HTML, run, rs_res none, retry) — 07은 거절도 그 번호에 1시간 기억 → 사람이 다시 누르면 늘 새 번호.
  · 목록 새로 = 화면이 보이는 동안 45초마다 + 앱으로 돌아올 때(새 결과지가 저장되면 저절로 — 유성 11-26 2판). 누르는 중, 시트 연 중, 보내는 중엔 기다렸다가 제자리에.
  · 감시 = 생각공작소 scripts/19_근태관리/tests/결과발송.test.js(진짜 크롬 + 가짜 07).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db;
  --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968;
  --g800:#333d4b; --g900:#191f28;
  --green50:#f8fbf9; --green100:#f0f8f3; --green200:#d5efde; --green600:#3a8a5f; --green700:#166841; --green800:#01492a;
  --red:#f04452; --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#8a5a00;
  --p-disabled:#b7e0c8; --danger:#D25357; --danger-weak-bg:#fdecee; --danger-weak-fg:#c0392b; --dark:#525966; --dark-disabled:#c8ccd0;
  --fs-h3:20px; --fs-title:17px; --fs-body:15px; --fs-sm:13.5px; --fs-caption:12px;
  --sf-bot:linear-gradient(to bottom,rgba(22,104,65,0) 0%,rgba(22,104,65,.055) 100%);
  --sf-top:linear-gradient(to top,rgba(22,104,65,0) 0%,rgba(22,104,65,.055) 100%);
  --ease:cubic-bezier(.22,.7,.25,1);
  --toast-bg:var(--g800); --toast-fg:#F9FBFA; --toast-r:23px; --toast-ck:18px; /* §5.5 토스트 — docs/1 §3.1 정본 사본(이 파일은 토큰동기 마커 밖, 정본 바꿀 땐 같이) */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{color:var(--g900);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-size:var(--fs-body);line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;user-select:none}
button,input{font-family:inherit}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
svg.li{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 머리 = [← 검사 결과 발송] [− ≡] (−는 PC 프로그램 안에서만) */
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:18px 24px 6px;min-height:52px;flex:none;background:#fff;position:relative;z-index:20}
.hd .lt{display:flex;align-items:center;gap:2px;min-width:0;flex:1}
.hd .rt{display:flex;gap:2px;flex:none}
.hd .t{font-size:var(--fs-title);font-weight:800;letter-spacing:-.3px;line-height:normal}
.hd .ic{width:38px;height:38px;border-radius:12px;background:none;border:0;display:flex;align-items:center;justify-content:center;color:var(--g900);cursor:pointer;flex:none;padding:0;transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.hd .ic:active{transform:scale(.82)}
.hd .ic svg{width:22px;height:22px}
.hd .back{margin-left:-10px}
#hostMin{display:none}
#appMenu{position:relative}
.mdot{position:absolute;top:7px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff;display:none;pointer-events:none}
.mdot.on{display:block}
/* 띠 = 시험 중, 꺼짐(주황 약함 — 빨강 덮기 금지 §4.5) */
.band{display:none;margin:4px 18px 6px;background:var(--warn-weak-bg);color:var(--warn-weak-fg);border-radius:12px;padding:9px 12px;font-size:var(--fs-sm);font-weight:600;flex:none}
.band.on{display:block}
/* 검색 칸(§4.1 큰 채움) + 지우기 X(§4.1-4 — 15px g300 원, 글자가 있을 때만) */
.sq{padding:2px 16px 8px;flex:none;background:#fff}
.sq .inw{position:relative}
.sq input{width:100%;border:1.5px solid transparent;background:var(--g100);border-radius:14px;padding:11px 40px 11px 14px;font-size:var(--fs-body);outline:none;color:var(--g900);user-select:text;caret-color:var(--green600);appearance:none;-webkit-appearance:none}
.sq input:focus{border-color:var(--green600);background:#fff}
.sq input::placeholder{color:var(--g500)}
.sq .clr{display:none;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;border:none;border-radius:50%;background:var(--g300);color:#fff;padding:0;cursor:pointer;align-items:center;justify-content:center}
.sq .inw.has-val .clr{display:flex}
.sq .clr svg{width:7px;height:7px;display:block}
/* 스크롤 = 막대 없이 넘칠 때만 위아래 초록 그라디언트(§4.13-6) */
.sw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.sw::before,.sw::after{content:"";position:absolute;left:0;right:0;height:22px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.sw::before{top:0;background:var(--sf-top)}
.sw::after{bottom:0;background:var(--sf-bot)}
.sw.more::after,.sw.moreTop::before{opacity:1}
.list{flex:1;overflow-y:auto;padding:4px 16px 18px;scrollbar-width:none;display:flex;flex-direction:column;gap:10px}
.list::-webkit-scrollbar{width:0}
/* 묶음 머리 */
.gh{display:flex;align-items:baseline;gap:6px;margin:12px 2px -2px;font-size:14px;font-weight:700;color:var(--g800)}
.gh:first-child{margin-top:4px}
.gh .cnt{margin-left:auto;font-size:13px;font-weight:600;color:var(--g600)}
/* 보낼 결과지 카드 = /contact .mode-card(흰 바탕, 테두리 없음, 그림자, radius 16, 눌림 .96) */
.kc{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;background:#fff;border:1.5px solid transparent;border-radius:16px;padding:14px 14px 13px 16px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;flex:none;transition:transform .08s;position:relative}
.kc:active:not(.hold){transform:scale(.96)}
.kc:has(.rc:active){transform:none}
.kc.new{animation:rowin .5s var(--ease)}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.kc .lf{flex:1;min-width:0;display:flex;flex-direction:column}
/* 고르는 칸 = 카드 오른쪽 칸 전체(84px 폭 — 동그라미 26px의 3배 넘게, 유성 11-26 「눌리는 범위를 좀 더 크게」). 그 칸을 누르는 동안 카드는 안 눌림 */
.kc .rc{flex:none;min-width:84px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;cursor:pointer;margin:-14px -14px -13px 0;padding:14px 14px 13px 14px}
.kc.hold .rc{cursor:default}
.c1{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-size:var(--fs-title);font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sub{font-size:var(--fs-sm);color:var(--g600);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{font-size:var(--fs-caption);color:var(--g600);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3 .miss{color:var(--g300)}   /* 기다림 = g300(유성 11-26 「흐린글자 2번하되, var(--g300)」 — 이번만, 흰 바탕 대비 1.46 일부러 흐리게) */
.l3.warn{color:var(--warn-weak-fg);font-weight:600;white-space:normal}
.l3.bad{color:var(--danger-weak-fg);font-weight:600}   /* 확인할 파일 까닭 = §4.5-2 빨강 허용, 12px 글자라 --danger-weak-fg(5.44, 유성 11-26 「권장대로」) */
/* 센터 뱃지 = §4.18 받은함 뱃지 크기 + 센터 색 쌍(prototype/디자인원칙_센터뱃지색_프리뷰.html 권장) */
.cb{display:inline-flex;align-items:center;font-size:11px;font-weight:600;line-height:1.6;border-radius:6px;padding:0 6px;white-space:nowrap;flex:none}
.cb.미추{background:#d6e3d1;color:#346d1b}.cb.서구{background:#d4e0f6;color:#1155cc}.cb.행복{background:#f7dbbe;color:#80511f}.cb.연수{background:#eaddd3;color:#8b4513}
.et{display:inline-flex;align-items:center;font-size:11px;font-weight:600;line-height:1.6;border-radius:6px;padding:0 6px;white-space:nowrap;flex:none;background:var(--g100);color:var(--g600)}
.mtag{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;border-radius:6px;padding:0 6px;background:var(--warn-weak-bg);color:var(--warn-weak-fg);margin-right:5px;vertical-align:baseline}
.mtag.g{background:var(--g100);color:var(--g600);font-weight:600}
.stg1{font-size:13px;font-weight:700;color:var(--g700);white-space:nowrap;line-height:1.4}
/* 고르기 동그라미 + 「발송 중」(§4.22 weak + §5.2 출렁이는 점) */
.kpk{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--g300);display:flex;align-items:center;justify-content:center;transition:background .12s,box-shadow .12s,transform .12s}
.kpk i{display:flex;opacity:0}.kpk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kpk.on{background:var(--green600);box-shadow:none}.kpk.on i{opacity:1}
.kc .rc:active .kpk{transform:scale(.88)}
.kq{font-size:12px;font-weight:700;color:var(--g600);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ld{display:inline-flex;gap:3px;align-items:center;margin-left:2px}
.ld i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:ldb 1s infinite ease-in-out}
.ld i:nth-child(2){animation-delay:.16s}.ld i:nth-child(3){animation-delay:.32s}
@keyframes ldb{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-3px);opacity:1}}
@media (prefers-reduced-motion:reduce){.ld i{animation:none;opacity:.7}}
/* 보낸 뒤 = 06 Apply.html .card-chk 그대로(카드 전체 흰 50% 덮개 + 가운데 34px 초록 원 팝 + 흰 체크 그리기) → 0.8초 뒤 접힘 */
.kc .card-chk{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);border-radius:inherit;pointer-events:none}
.kc .card-chk b{width:34px;height:34px;border-radius:50%;background:var(--green600);display:flex;align-items:center;justify-content:center;transform:scale(0);animation:cardcpop .3s cubic-bezier(.34,1.56,.64,1) forwards}
.kc .card-chk svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;animation:cardcdraw .25s .12s ease forwards}
@keyframes cardcpop{to{transform:scale(1)}}
@keyframes cardcdraw{to{stroke-dashoffset:0}}
/* 확인할 파일 = 얇은 테두리 카드 */
.row{display:block;width:100%;text-align:left;border:1px solid var(--g200);border-radius:16px;padding:12px 14px;background:#fff;cursor:pointer;flex:none;transition:box-shadow .12s;font:inherit;color:inherit}
.row > *{transition:transform .12s}
.row:active{box-shadow:0 1px 4px rgba(25,31,40,.06),0 6px 18px rgba(25,31,40,.12)}
.row:active > *{transform:scale(.97)}
.fname{font-size:var(--fs-sm);font-weight:700;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 최근 보낸 결과지 = 한 상자 안 줄 목록 */
.sent{background:var(--g50);border-radius:16px;padding:2px 0;flex:none}
.sr{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 14px;cursor:pointer;font:inherit;color:inherit;position:relative;transition:background .12s}
.sr + .sr::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--g200)}
.sr:active{background:var(--g100)}
.sr .lf{flex:1;min-width:0}
.sr .nm{font-size:var(--fs-body);font-weight:700}
.sr .st{flex:none;font-size:12.5px;font-weight:600;color:var(--g600)}
.sr .st.ok{color:var(--green700)}
.sr .st.wt{color:var(--g500)}
.sr .st.warn{color:var(--warn-weak-fg)}
.sr.hl{animation:hl 1.6s var(--ease)}
@keyframes hl{0%{background:var(--green100)}100%{background:transparent}}
.foot{font-size:var(--fs-caption);color:var(--g600);text-align:center;margin-top:2px}
.empty{text-align:center;color:var(--g600);font-size:14px;padding:22px 16px 18px;border:1px dashed var(--g200);border-radius:16px}
.empty b{display:block;color:var(--g900);font-size:15px;margin-bottom:2px}
.empty .b2{margin-top:10px}
/* 뼈대(§5.4) */
.sk-b{display:block;background:var(--g100);border-radius:8px;background-image:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 70%);background-size:300% 100%;background-repeat:no-repeat;animation:sksh 1.5s ease-in-out infinite;pointer-events:none}
@keyframes sksh{0%{background-position:150% 0}70%,100%{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.sk-b{animation:none}}
.kc.skc{cursor:default;pointer-events:none}
/* 아래 바(고르고 한 번에 보내기) — 빈 채 누르면 흔들림(§4.9) */
.selbar{flex:none;padding:8px 16px 14px;background:#fff;box-shadow:0 -1px 0 var(--g100)}
.mb{width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-size:var(--fs-body);font-weight:700;cursor:pointer;transition:transform .12s;display:flex;align-items:center;justify-content:center;gap:3px}
.mb:active{transform:scale(.97)}
.mb.dk{background:var(--dark);color:#fff}
.mb.dk.gate{background:var(--dark-disabled)}
.mb.wk{background:var(--g100);color:var(--dark)}
.mb.busy{background:var(--g100);color:var(--dark);cursor:default;transform:none}
.mb.no{background:var(--g100);color:var(--g600)}
.mb.dg{background:var(--danger);color:#fff}
.mb .ld i{width:5px;height:5px}
.btns{display:flex;gap:8px}
@keyframes shakeX{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
.shake{animation:shakeX .28s cubic-bezier(.36,.07,.19,.97)}
/* 바텀시트 = §4.3 떠 있는 판 + 끌어내려 닫기 */
.mdim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.mdim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:24px;padding:0 18px 16px;transform:translateY(110%);transition:transform .28s var(--ease);z-index:31;max-height:88%;display:flex;flex-direction:column;will-change:transform}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.sgrab{padding-top:10px;cursor:grab;touch-action:none;flex:none}
.sheet.drag .sgrab{cursor:grabbing}
.handle{width:40px;height:4px;border-radius:2px;background:var(--g200);margin:0 auto 12px}
.sbd{overflow-y:auto;scrollbar-width:none;min-height:0;display:flex;flex-direction:column;gap:8px}
.sbd::-webkit-scrollbar{width:0}
.shd .nm{font-size:var(--fs-h3)}
.shd .sub{margin-top:0}
.sft{margin-top:12px;flex:none}
.kv{margin:0;padding:0}
.kv div{display:flex;gap:10px;font-size:var(--fs-sm);line-height:1.55;padding:2px 2px}
.kv dt{width:84px;flex:none;color:var(--g600)}
.kv.tlv{background:var(--g50);border-radius:12px;padding:6px 8px}
.kv.tlv dt{width:auto;min-width:84px;white-space:nowrap}
.kv dd{margin:0;color:var(--g900);min-width:0;overflow-wrap:anywhere}
.kv dd.no{color:var(--g500)}
.fr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--g200);border-radius:14px;padding:10px 10px 10px 12px;background:#fff;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s}
.fr .ck{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--g300);display:flex;align-items:center;justify-content:center;transition:background .12s,box-shadow .12s}
.fr .ck svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}

var S = { on: null, mode: '', tryAt: 0, pollT: null, vis: false, data: null, err: false, loading: false, loadSeq: 0, loadAt: 0, pend: null, q: '', search: null, sSeq: 0, sLoading: false,

  var now = Date.now();

    if (x && x.state === 'done') done(o, x.res); else if (x && x.state === 'run') askLater(o); else fire(o);
  }, function(){ if (S.jobs[id] === o) askLater(o); });
}

/* ══════════ 확인할 파일 고치기 ══════════ */
function fixGo(btn){
  var c = findChk(S.sheet.id); if (!c || S.fixing) return;
  if (S.fxPick === -1) { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); toast('아동을 먼저 골라 주세요'); return; }
  var why = cantWhy(); if (why) { toast(why); return; }
  var x = candsSorted(c)[S.fxPick];
  S.fixing = true; paintSheet();
  call({ action: 'rs_fix', id: c.id, to: { tab: x.tab, svc: x.svc, label: x.label, b6: x.b6 } }, 45000).then(function(r){
    S.fixing = false;
    if (r && r.ok) { S.hold[c.id] = Date.now(); S.sheet = null; paintSheet(); S.shiftAt = Date.now(); paintList(); setTimeout(function(){ toast(x.label + ' 결과지를 보낼 결과지로 옮겼어요', true); }, 300); load(true); return; }
    var w = r && r.why;
    paintSheet();
    toast(w === 'exists' ? '같은 이름 파일이 폴더에 이미 있어요. 폴더에서 확인해 주세요' : w === 'gone' ? '파일이 바뀌었어요. 목록을 다시 불러올게요' : w === 'kid' ? '이 아동으로는 맞출 수 없어요' : offReply(r) ? '지금은 맞출 수 없어요' : '파일 이름을 못 바꿨어요. 다시 눌러 주세요');
    if (w === 'gone' || w === 'kid') { S.sheet = null; paintSheet(); load(true); }
  }, function(){ S.fixing = false; paintSheet(); toast('결과를 못 받았어요. 잠시 뒤 목록을 확인해 주세요'); load(true); });
}

/* ══════════ 열기(앱 안 창) ══════════ */
var FC = {};
function openFile(q, btn){
  var key = q.job ? 'j:' + q.job + ':' + q.i : 'f:' + q.id, c = FC[key];
  if (c && c.url) { showView(c); return; }
  if (c && c.p) return;
  var was = btn ? btn.innerHTML : '';
  if (btn) btn.innerHTML = '여는 중' + LD;
  c = FC[key] = {};
  var b = q.job ? { action: 'rs_file', job: q.job, i: q.i } : { action: 'rs_file', id: q.id };
  c.p = call(b, 45000).then(function(r){
    if (btn) btn.innerHTML = was;
    if (!r || !r.ok || !r.b64) { delete FC[key]; toast(r && r.why === 'gone' ? '파일이 폴더에서 바뀌었어요. 목록을 다시 불러올게요' : '파일을 열지 못했어요'); if (r && r.why === 'gone') load(true); return; }
    var bin = atob(r.b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    c.url = URL.createObjectURL(new Blob([u], { type: 'application/pdf' })); c.n = r.name; c.p = null;
    showView(c);
  }, function(){ if (btn) btn.innerHTML = was; delete FC[key]; toast('파일을 열지 못했어요'); });
}
function showView(c){ var v = $('fView'), b = v.querySelector('.vb'); b.innerHTML = ''; var fr = document.createElement('iframe'); fr.title = c.n || 'PDF'; fr.src = c.url; b.appendChild(fr); v.classList.add('on'); v.querySelector('.vx').focus(); }
function closeView(){ var v = $('fView'); if (!v.classList.contains('on')) return false; v.classList.remove('on'); v.querySelector('.vb').innerHTML = ''; return true; }
$('fView').addEventListener('click', function(e){ if (e.target === this || e.target.classList.contains('vb') || e.target.closest('.vx')) closeView(); });

/* ══════════ 지난 링크 닫기 확인 창 ══════════ */
function offAsk(){
  var k = S.sheet && findItem(S.sheet.id); if (!k || !k.job) return;
  S.cfm = { job: k.job, id: S.sheet.id }; S.cfmAt = Date.now();
  $('cfmT').textContent = OFFW.t; $('cfmS').textContent = OFFW.s; $('cfmNo').textContent = OFFW.no; $('cfmGo').textContent = OFFW.go;
  $('cdim').classList.add('on'); $('cfm').classList.add('on');
}
function closeCfm(){ if (!S.cfm || S.offing) return !!S.cfm; S.cfm = null; $('cfm').classList.remove('on'); $('cdim').classList.remove('on'); return true; }
$('cfmNo').addEventListener('click', function(){ if (Date.now() - S.cfmAt < 400) return; closeCfm(); });   // 뜨자마자 떨어진 누름(직전 누름의 잔상)은 고른 게 아니다
$('cdim').addEventListener('click', function(){ if (Date.now() - S.cfmAt > 400) closeCfm(); });
$('cfmGo').addEventListener('click', function(){
  if (!S.cfm || S.offing || Date.now() - S.cfmAt < 400) return;
  var c = S.cfm, b = this;
  S.offing = true; b.innerHTML = OFFW.go + LD;
  call({ action: 'rs_off', job: c.job }).then(function(x){
    S.offing = false; b.textContent = OFFW.go;
    if (x && x.ok) {
      closeCfm(); toast(x.dup ? '이미 닫은 링크예요' : OFFW.toast, true);
      var k = findItem(c.id); if (k) { k.off = true; k.st = '닫음'; var n = new Date(); k.tl = (k.tl || []).concat([['지난 링크 닫음', (n.getMonth() + 1) + '/' + n.getDate() + ' ' + ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2)]]); }
      paintSheet(); paintList(); load(true); return;
    }
    toast(offReply(x) ? '지금은 닫을 수 없어요' : '닫지 못했어요. 다시 눌러 주세요');
  }, function(){ S.offing = false; b.textContent = OFFW.go; closeCfm(); toast('결과를 못 받았어요. 보낸 결과지를 다시 확인해 주세요'); load(true); });
});

/* ══════════ 토스트 ══════════ */
var tT = null;
function toast(t, ok){ var a = $('atoast'); a.querySelector('span').textContent = t; a.classList.toggle('ok', !!ok); a.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ a.classList.remove('on'); }, 2600); }
function copyText(t){
  var ok = function(){ toast('링크를 복사했어요', true); }, no = function(){ toast('복사하지 못했어요. 링크를 끌어서 골라 주세요'); };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(ok, function(){ fallback() ? ok() : no(); }); return; } } catch (e) { }
  if (fallback()) ok(); else no();
  function fallback(){ try { var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); var r = document.execCommand('copy'); ta.remove(); return r; } catch (x) { return false; } }
}

/* ══════════ 누름 ══════════ */
document.addEventListener('pointerdown', function(){ S.pressing = true; }, true);
document.addEventListener('pointerup', function(){ S.pressing = false; }, true);
document.addEventListener('pointercancel', function(){ S.pressing = false; }, true);
$('sdim').addEventListener('click', function(){ closeSheet(); });
$('selbar').addEventListener('click', function(e){ if (e.target.closest('[data-act="sendsel"]')) sendSel(); });
$('lst').addEventListener('click', function(e){
  var t = e.target;
  if (t.closest('[data-act="reload"]')) { S.err = false; paintList(); load(); return; }
  // 고르기 — 목록이 방금 움직였으면(보낸 카드가 빠짐, 새 카드가 끼어듦) 0.6초는 안 받음
  var kp = t.closest('[data-kpick]');
  if (kp) { e.stopPropagation(); if (S.anim > 0 || Date.now() - S.shiftAt < GUARD_MS) return; var pid = kp.getAttribute('data-kpick'); if (S.sel[pid]) delete S.sel[pid]; else S.sel[pid] = true; paintList(); return; }
  var k = t.closest('.kc[data-k]'); if (k && !k.classList.contains('skc')) { openSheet({ t: 'kid', id: k.getAttribute('data-k') }); return; }
  var c = t.closest('[data-c]'); if (c) { openSheet({ t: 'chk', id: c.getAttribute('data-c') }); return; }
  var s = t.closest('[data-s]'); if (s) { openSheet({ t: 'sent', id: s.getAttribute('data-s') }); return; }
});
$('sheet').addEventListener('click', function(e){
  var t = e.target;
  var op = t.closest('[data-open]'); if (op) { e.stopPropagation(); openFile({ id: op.getAttribute('data-open') }, op); return; }
  var oj = t.closest('[data-ojob]'); if (oj) { e.stopPropagation(); openFile({ job: oj.getAttribute('data-ojob'), i: +oj.getAttribute('data-oi') }, oj); return; }
  var cp = t.closest('[data-copy]'); if (cp) { copyText(cp.getAttribute('data-copy')); return; }
  var pk = t.closest('[data-pick]'); if (pk) { if (S.fixing) return; S.fxPick = +pk.getAttribute('data-pick'); paintSheet(); return; }
  var fr = t.closest('.fr[data-f]');
  if (fr) { if (S.sheet && isBusy(S.sheet.id)) return; var kd = fr.getAttribute('data-kd'), id = fr.getAttribute('data-f'); S.pick[kd] = S.pick[kd] === id ? '' : id; paintSheet(); return; }   // 한 종류에 하나만(누른 것으로 바꿈), 다시 누르면 뺌
  var a = t.closest('[data-act]'); if (!a) return;
  var act = a.getAttribute('data-act');
  if (act === 'vopen') { S.vOpen = true; paintSheet(); return; }
  if (act === 'rvopen') { S.rvOpen = true; paintSheet(); return; }
  if (act === 'sheetsend') { sheetSend(a); return; }
  if (act === 'again') { againStuck(S.sheet.id); return; }
  if (act === 'fixgo') { fixGo(a); return; }
  if (act === 'linkoff') { offAsk(); return; }
  if (act === 'resend') {
    if (!canSend()) { a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); toast(cantWhy()); return; }
    S.sheet = { t: 'sent', id: S.sheet.id, resend: true }; S.vOpen = false; S.pick = defaultPick(S.sheet); paintSheet(); return;
  }
});

/* ══════════ ← 뒤로 = 확인 창 → 크게 보기 → 시트 → 검색 → 앱 ══════════ */
function back(){
  if (closeCfm()) return true;
  if (closeView()) return true;
  if (S.sheet) { if (S.sheet.resend) { S.sheet = { t: 'sent', id: S.sheet.id }; paintSheet(); return true; } closeSheet(); return true; }
  if ($('q').value) { $('q').value = ''; onQ(false); return true; }
  return false;
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && back()) e.preventDefault(); });
$('appBack').addEventListener('click', function(){ if (!back()) toApp({ type: 'back' }); });
$('appMenu').addEventListener('click', function(){ toApp({ type: 'menu' }); });
if (HOSTED) {
  $('hostMin').style.display = 'flex';
  $('hostMin').addEventListener('click', function(){ toApp({ type: 'close' }); });
  (function(){
    var st = document.createElement('style'); document.documentElement.appendChild(st);
    var on = false;
    function setCur(v){ if (v === on) return; on = v; st.textContent = v ? '*{cursor:move !important}' : ''; }
    document.addEventListener('mousemove', function(e){ setCur(e.clientY <= 12); }, true);
    document.addEventListener('mouseleave', function(){ setCur(false); }, true);
    document.addEventListener('mousedown', function(e){
      if (e.button !== 0 || e.clientY > 12) return;
      e.preventDefault(); e.stopPropagation();
      toApp({ type: 'edge' });
    }, true);
  })();
}
window.addEventListener('message', function(e){
  if (!EMBED || e.source !== parent || e.origin !== location.origin) return;
  var d = e.data || {}; if (d.tf !== 'rs') return;
  if (d.type === 'vis') { S.vis = !!d.on; if (d.on) { paintBand(); tick(); if (!S.loading && Date.now() - S.loadAt > 15000) load(!S.data ? false : true); } }
  if (d.type === 'dot') $('menuDot').classList.toggle('on', !!d.on);   // 메뉴 아이콘 점 = 앱 다른 메뉴 아이콘과 같은 값(문의 숫자)
  if (d.type === 'hwback') { if (!back()) toApp({ type: 'back' }); }   // 폰 뒤로가기 = 확인 창, 시트부터
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });

if (EMBED) { paintList(); paintBand(); ping(); load(); tick(); }
</script>
